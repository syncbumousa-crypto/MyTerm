<!-- ============================================================ -->
<!-- # 🔤 HTML -->
<!-- # 🎯 إعلان نوع المستند، يُخبر المتصفّح أن الملف HTML حديث -->
<!-- # 🔗 يأتي أولًا قبل كل شيء، وبدونه تُقرأ الكتل التالية قراءة خاطئة -->
<!-- ============================================================ -->
<!DOCTYPE html>

<!-- ============================================================ -->
<!-- # 🔤 HTML -->
<!-- # 🎯 جذر الصفحة، يحدّد لغتها عربية واتجاهها من اليمين -->
<!-- # 🔗 يحتوي الكتلتين الكبيرتين بعده، head و body -->
<!-- ============================================================ -->
<html lang="ar" dir="rtl">

<!-- ============================================================ -->
<!-- # 🔤 HTML -->
<!-- # 🎯 قسم المعلومات، يحمل ما يحتاجه المتصفّح قبل الرسم ولا يُرى في الصفحة -->
<!-- # 🔗 يسبق body لأن ما فيه يُطبَّق قبل رسم المحتوى -->
<!-- ============================================================ -->
<head>

<!-- ============================================================ -->
<!-- # 🔤 HTML -->
<!-- # 🎯 الترميز، يجعل المتصفّح يقرأ الحروف العربية صحيحة -->
<!-- # 🔗 يسبق كل نص عربي في الملف وإلا ظهر مشوّشًا -->
<!-- ============================================================ -->
<meta charset="utf-8">

<!-- ============================================================ -->
<!-- # 🔤 HTML -->
<!-- # 🎯 مقاس العرض، يجعل الصفحة تُعرض بحجمها الصحيح على الجوّال -->
<!-- # 🔗 يعمل مع كتلة CSS التالية التي تضبط الأبعاد -->
<!-- ============================================================ -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ============================================================ -->
<!-- # 🔤 HTML -->
<!-- # 🎯 عنوان التبويب في المتصفّح -->
<!-- # 🔗 لا يظهر داخل الصفحة، ولا تعتمد عليه كتلة أخرى -->
<!-- ============================================================ -->
<title>MyTerm</title>

<!-- ============================================================ -->
<!-- # 🔤 HTML -->
<!-- # 🎯 كتلة التنسيق، وما بينها وبين إغلاقها لغته CSS لا HTML -->
<!-- # 🔗 هي التي تُنتج كل ما يراه الزائر، لأن body بعدها فارغ -->
<!-- ============================================================ -->
<style>

  /* ========================================================== */
  /* # 🔤 CSS */
  /* # 🎯 القاعدة الوحيدة في الموقع. تُلغي فراغات المتصفّح الافتراضية، */
  /* #    وتجعل ارتفاع الصفحة كامل الشاشة، وتصبغ الخلفية رماديًّا */
  /* # 🔗 تعمل على html و body معًا لأن الارتفاع الكامل يحتاجهما، */
  /* #    ولولا height لظهر الرمادي شريطًا في الأعلى فقط */
  /* ========================================================== */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #808080;
  }

</style>
</head>

<!-- ============================================================ -->
<!-- # 🔤 HTML -->
<!-- # 🎯 جسم الصفحة، وهو فارغ عن قصد لأن الموقع صفحة رمادية بلا محتوى -->
<!-- # 🔗 لا يظهر منه شيء إلا الخلفية التي صبغتها كتلة CSS السابقة -->
<!-- ============================================================ -->
<body></body>

</html>
