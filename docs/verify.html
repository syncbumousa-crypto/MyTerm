<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حارس MyTerm</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #1e1e1e; color: #eaeaea;
         font-family: system-ui, "Segoe UI", sans-serif; line-height: 1.7; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  .sub { margin: 0 0 20px; font-size: .85rem; color: #9a9a9a; }
  .bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  input, button { font: inherit; font-size: .9rem; padding: 8px 12px; border-radius: 8px;
                  border: 1px solid #555; background: #262626; color: #eaeaea; }
  button { cursor: pointer; background: #eaeaea; color: #1e1e1e; border-color: #eaeaea; font-weight: 600; }
  .score { font-size: 1.05rem; font-weight: 700; margin: 0 0 14px; }
  .ok { color: #7bc49a; } .bad { color: #ff9a9a; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  td { padding: 7px 10px; border-bottom: 1px solid #333; vertical-align: top; }
  td:first-child { width: 34px; text-align: center; }
  .why { color: #9a9a9a; font-size: .8rem; direction: ltr; text-align: left; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <h1>حارس MyTerm</h1>
  <p class="sub">يفحص الموقع كما هو منشور. وكل فحصٍ هنا وُلد من عطبٍ وقع فعلًا.</p>

  <div class="bar">
    <input id="base" size="46" value="">
    <button id="run" type="button">افحص</button>
  </div>

  <p class="score" id="score">…</p>
  <table><tbody id="rows"></tbody></table>
</div>

<script>
// ============================================================
// # 🛡️ 🔍  THE GUARD
// # 🔤 JavaScript
// # 🎯 Reads the published page and every file it calls, then asks of
// #    each one a question that was once answered wrongly in this
// #    project. It prints a pass or a fail and the reason
// # 🔗 It is a page, not a build step, because this site has no build
// #    step: it is plain files served as they are. So the only honest
// #    way to check them is to fetch them the way a visitor does, from
// #    the address bar, against any branch by changing the box above
// ============================================================
(() => {
  const $ = id => document.getElementById(id);
  const here = location.href.replace(/verify\.html.*$/, '');
  $('base').value = here;

  const rows = [];
  const check = (name, pass, why) => rows.push({ name, pass, why: why || '' });

  const text = async url => {
    const r = await fetch(url, { cache: 'no-store' });
    return { ok: r.ok, status: r.status, body: r.ok ? await r.text() : '' };
  };

  // ============================================================
  // # 📋 🧪  THE QUESTIONS
  // # 🔤 JavaScript
  // # 🎯 Eight questions, each one a defect that cost time: a file that
  // #    is not there, a stamp that disagrees, a name declared twice, a
  // #    handle nobody defines, an id nobody drew, a comment naming a
  // #    file that is gone, broken syntax, and a leaked name
  // # 🔗 The id question is the one that catches the most: the page and
  // #    the code are two files that must agree, and nothing but a
  // #    check like this one makes them agree out loud
  // ============================================================
  const run = async () => {
    rows.length = 0;
    $('score').textContent = 'يفحص…';
    $('rows').innerHTML = '';
    const base = $('base').value.replace(/\/?$/, '/');

    const page = await text(base + 'index.html');
    if (!page.ok) {
      check('الصفحة تُحمَّل', false, 'HTTP ' + page.status);
      return draw();
    }
    check('الصفحة تُحمَّل', true);

    const doc = new DOMParser().parseFromString(page.body, 'text/html');
    const ids = [...doc.querySelectorAll('[id]')].map(e => e.id);
    const mark = (doc.querySelector('.build')?.textContent || '').trim();

    const refs = [...doc.querySelectorAll('script[src], link[href]')]
      .map(e => e.getAttribute('src') || e.getAttribute('href'))
      .filter(u => u && !/^https?:/.test(u));

    // ١ — كل ملف تطلبه الصفحة موجود
    const files = {};
    let missing = [];
    for (const ref of refs) {
      const path = ref.split('?')[0];
      const got = await text(base + path.split('/').map(encodeURIComponent).join('/'));
      if (!got.ok) missing.push(path + ' → ' + got.status); else files[path] = got.body;
    }
    check('كل ملف تطلبه الصفحة موجود', missing.length === 0, missing.join(' · '));

    // ٢ — بصمة الإصدار واحدة في الكل، وتطابق علامة الزاوية
    const stamps = [...new Set(refs.map(r => (r.match(/\?v=(\d+)/) || [])[1]).filter(Boolean))];
    const sameStamp = stamps.length === 1 && mark === 'v' + stamps[0];
    check('بصمة الإصدار متّفقة', sameStamp, 'في الاستدعاءات: ' + stamps.join(',') + ' · في الزاوية: ' + mark);

    const js = Object.entries(files).filter(([p]) => p.endsWith('.js'));

    // ٣ — كل ملف برمجة سليم نحويًّا
    const broken = js.filter(([, src]) => { try { new Function(src); return false; } catch { return true; } });
    check('كل ملف برمجة سليم نحويًّا', broken.length === 0, broken.map(([p]) => p).join(' · '));

    // ٤ — لا اسم يتسرّب إلى المساحة العامة (قتل هذا ملفًّا كاملًا مرّة)
    const leaks = [];
    js.forEach(([p, src]) => src.split('\n').forEach(l => {
      if (/^(const|let|var|function|async function|class)\s/.test(l)) leaks.push(p + ': ' + l.trim().slice(0, 40));
    }));
    check('لا اسم يتسرّب خارج غلافه', leaks.length === 0, leaks.join(' · '));

    // ٥ — كل معرّف يطلبه الكود مرسومٌ في الصفحة
    const wanted = new Set();
    js.forEach(([, src]) => {
      [...src.matchAll(/getElementById\('([^']+)'\)/g)].forEach(m => wanted.add(m[1]));
      [...src.matchAll(/[^A-Za-z_$]\$\('([^']+)'\)/g)].forEach(m => wanted.add(m[1]));
    });
    const noSuchId = [...wanted].filter(id => !ids.includes(id));
    check('كل معرّف يطلبه الكود موجود في الصفحة', noSuchId.length === 0, noSuchId.join(' · '));

    // ٦ — كل اسمٍ عامّ يُستعمل، يُعرّفه ملفٌ قبله
    const made = new Set(), used = new Set();
    js.forEach(([, src]) => {
      [...src.matchAll(/window\.(MyTerm[A-Za-z]*)\s*=/g)].forEach(m => made.add(m[1]));
      [...src.matchAll(/window\.(MyTerm[A-Za-z]*)[^=\s]/g)].forEach(m => used.add(m[1]));
    });
    const orphan = [...used].filter(n => !made.has(n));
    check('كل اسمٍ مشترك يُعرّفه ملف', orphan.length === 0, orphan.join(' · '));

    // ٧ — لا تعليق يذكر ملفًّا لم يبقَ (وجدنا تسعةً منها مرّة)
    const names = new Set(Object.keys(files).map(p => p.split('/').pop()));
    names.add('index.html');
    const ghosts = [];
    js.concat(Object.entries(files).filter(([p]) => p.endsWith('.css'))).forEach(([p, src]) => {
      src.split('\n').forEach(l => {
        if (!/^\s*(\/\/|\/\*|#|\*)/.test(l)) return;
        [...l.matchAll(/([A-Za-z][\w.-]*\.(?:js|css|html|sql))/g)].forEach(m => {
          if (!names.has(m[1])) ghosts.push(p.split('/').pop() + ' → ' + m[1]);
        });
      });
    });
    check('لا تعليق يذكر ملفًّا لم يبقَ', ghosts.length === 0, [...new Set(ghosts)].join(' · '));

    // ٨ — ترتيب التحميل: الخفيّ قبل الشاشة
    const order = [...doc.querySelectorAll('script[src]')].map(s => s.getAttribute('src')).filter(u => !/^https?:/.test(u));
    const lastBack = order.map((u, i) => u.includes('B-End') ? i : -1).reduce((a, b) => Math.max(a, b), -1);
    const firstFront = order.findIndex(u => u.includes('F-End'));
    check('ملفات B-End كلها قبل ملفات F-End', lastBack < firstFront || firstFront === -1,
          'آخر خفيّ عند ' + lastBack + ' وأول شاشة عند ' + firstFront);

    draw();
  };

  const draw = () => {
    const bad = rows.filter(r => !r.pass).length;
    $('score').innerHTML = bad
      ? `<span class="bad">سقط ${bad} من ${rows.length}</span>`
      : `<span class="ok">مرّ ${rows.length} من ${rows.length}</span>`;
    $('rows').innerHTML = rows.map(r =>
      `<tr><td>${r.pass ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'}</td>` +
      `<td>${r.name}${r.why ? `<div class="why">${r.why}</div>` : ''}</td></tr>`).join('');
  };

  $('run').onclick = run;
  run();
})();
</script>
</body>
</html>
