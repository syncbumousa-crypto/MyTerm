<!doctype html>
<meta charset="utf-8">
<style>#host { width: 820px; }</style>
<title>Guard · a statement that answers a decision</title>
<pre id="o">pending</pre>
<div id="host"></div>
<script src="../docs/%F0%9F%93%9ATermBoard/B-End/TermSheetStore.js"></script>
<script src="../docs/%F0%9F%93%9ATermBoard/F-End/TermSheetPaper.js"></script>
<script>
  // ============================================================
  // # 🛡️ 🤔  ONE STATEMENT, AND THE DECISION THAT SHAPES IT
  // # 🔤 HTML + JavaScript
  // # 🎯 Asked on 2026-10-27: not three pre-drawn shapes picked from a
  // #    strip, but ONE statement over which the reader answers `what is
  // #    done with the net profit after taxes` - paid to the preferred
  // #    holders, paid to the common holders, kept in the company - and
  // #    the ladder changes under each press, in any combination.
  // # 🎯 What is measured: the gate keeps the question and its choices
  // #    and drops a stored `on`; the opening position comes from the
  // #    author's `data-on`; a choice shows exactly the rows whose
  // #    `data-when` holds; THE STEPS RENUMBER with no gap; the rule
  // #    badges renumber as their own sequence; exactly one variant of a
  // #    rule is ever visible; and the double rule follows the end of
  // #    the ladder wherever it now is.
  // # 🔗 THE REAL ENGINE IS DRIVEN, not a copy of it: `decide` and
  // #    `settle` are handed out by the paper. A guard carrying its own
  // #    `data-when` reader and its own renumbering would agree with
  // #    itself for ever, and the first change to either would be
  // #    measured against the old rule.
  // # 🔗 And the fixture is the REAL ladder - eighteen rows, the brace
  // #    over the operating expenses, the rule that sits on a line which
  // #    is not a rung. A fixture cleaner than the thing it stands for
  // #    measures the clean case only.
  // ============================================================
  window.onerror = (m, s, l, c) => {
    document.getElementById('o').textContent = 'FAIL ' + m + ' @' + l + ':' + c;
    return true;
  };
  (async () => {
    const o = document.getElementById('o'), host = document.getElementById('host');
    const S = window.MyTermSheetStore, P = window.MyTermSheetPaper;
    if (!S || typeof S.gate !== 'function') { o.textContent = 'FAIL the sheet store did not load'; return; }
    if (!P || typeof P.settle !== 'function' || typeof P.decide !== 'function') {
      o.textContent = 'FAIL the paper does not hand out its decision engine, so this guard would carry a copy';
      return;
    }
    const faults = [], out = [];
    const say = (ok, line) => { out.push((ok ? 'PASS ' : 'FAIL ') + line); if (!ok) faults.push(line); };

    // ---- the ladder, written the way the page is written
    const AR = t => '<span class="fsAr">' + t + '</span>';
    const WD = (en, arabic) => '<span class="fsWd">' + en + AR(arabic) + '</span>';
    const AN = (parts, when, hue) => '<span class="an' + (hue ? ' ' + hue : '') + '"'
      + (when ? ' data-when="' + when + '"' : '') + '><b>0</b>'
      + parts.map(p => Array.isArray(p) ? WD(p[0], p[1]) : ' ' + p + ' ').join('') + '</span>';
    const MS = '<span class="miss"></span>';
    const TR = (cells, cls, when) => '<tr' + (cls ? ' class="' + cls + '"' : '')
      + (when ? ' data-when="' + when + '"' : '') + '>' + cells + '</tr>';
    const C1 = (x, m, sp) => '<td class="c1' + (sp ? ' lbl' : '') + (m ? ' ' + m : '') + '"'
      + (sp ? ' rowspan="' + sp + '"' : '') + '>' + (x || '') + '</td>';
    const C2 = (x, m, i) => '<td class="c2' + (m ? ' ' + m : '') + (i ? ' in1' : '') + '">' + x + '</td>';
    const C3 = (x, m) => '<td class="c3' + (m ? ' ' + m : '') + '">' + (x || '') + '</td>';
    const step = (x, tag, when, hue) => TR(C1('0.', 'u') + C2(x, 'u') + C3(tag, 'u'), 'tot' + (hue ? ' ' + hue : ''), when);
    const item = (x, tag, when, hue) => TR(C1('') + C2(x, '', 1) + C3(tag || MS), hue || '', when);

    const company = '<tbody>'
      + TR(C1('0.', 'u') + C2('Total revenues' + AR('إجماليُّ الإيرادات'), 'u') + C3('', 'u'))
      + item('Less: cost of goods sold (COGS)' + AR('تكلفةُ البضاعة المباعة'))
      + step('Gross profit' + AR('مجملُ الربح'), AN([['revenues', 'الإيرادات'], '−', ['COGS', 'التكلفة']]))
      + TR(C1('Operating<br>expenses' + AR('مصروفاتُ التشغيل'), '', 5) + C2('Less:', '', 1) + C3(MS))
      + TR(C2('Less:', '', 1) + C3(MS)) + TR(C2('Less:', '', 1) + C3(MS)) + TR(C2('Less:', '', 1) + C3(MS))
      + TR(C2('Total operating expenses' + AR('إجماليُّ مصروفات التشغيل'), 'u', 1) + C3('', 'u'))
      + step('Operating profit (EBIT)' + AR('الربحُ التشغيليّ'),
             AN([['gross profit', 'مجملُ الربح'], '−', ['total operating expenses', 'مصروفاتُ التشغيل']]))
      + item('Less: interest expense' + AR('مصروفُ الفوائد'))
      + step('Net profit before taxes' + AR('الربحُ قبل الضريبة'),
             AN([['EBIT', 'الربحُ التشغيليّ'], '−', ['interest expense', 'مصروفُ الفوائد']]))
      // A RULE ON A LINE THAT IS NOT A RUNG - the case that broke the
      // first renumbering, which counted badges off the steps
      + item('Less: taxes' + AR('الضريبة'), AN([['tax rate', 'معدّلُ الضريبة'], '×', ['pre-tax profit', 'الربحُ قبل الضريبة']]))
      + step('Net profit after taxes' + AR('صافي الربح بعد الضريبة'),
             AN([['pre-tax profit', 'الربحُ قبل الضريبة'], '−', ['taxes', 'الضريبة']]))
      + item('Less: preferred stock dividends' + AR('توزيعاتُ الأسهم الممتازة'), null, 'pfd', 'fsHueA')
      + step('Earnings available for common stockholders' + AR('المتاحُ للمساهمين العاديين'),
             AN([['net profit', 'صافي الربح'], '−', ['preferred dividends', 'توزيعاتُ الممتاز']]), 'pfd', 'fsHueA')
      // ONE RUNG, TWO RULES: which numerator is right depends on another
      // decision entirely, and exactly one of them may ever be showing. The
      // RUNG is always there, so it wears no hue - but the reading of it
      // that the preferred decision brings does
      + step('Earnings per share (EPS)' + AR('ربحيّةُ السهم'),
             AN([['earnings available', 'المتاحُ للعاديين'], '÷', ['shares outstanding', 'الأسهمُ القائمة']], 'pfd', 'fsHueA')
             + AN([['net profit', 'صافي الربح'], '÷', ['shares outstanding', 'الأسهمُ القائمة']], '!pfd'))
      + item('Less: common stock dividends' + AR('توزيعاتُ الأسهم العاديّة'), null, 'com', 'fsHueB')
      + step('Dividends per share (DPS)' + AR('نصيبُ السهم من التوزيعات'),
             AN([['common stock dividends', 'توزيعاتُ العاديّ'], '÷', ['shares outstanding', 'الأسهمُ القائمة']]), 'com', 'fsHueB')
      + step('Addition to retained earnings' + AR('الإضافةُ إلى الأرباح المحتجزة'),
             AN([['net profit', 'صافي الربح'], '−', ['preferred dividends', 'توزيعاتُ الممتاز'],
                 '−', ['common stock dividends', 'توزيعاتُ العاديّ']], 'pfd,com')
             + AN([['net profit', 'صافي الربح'], '−', ['preferred dividends', 'توزيعاتُ الممتاز']], 'pfd,!com')
             + AN([['net profit', 'صافي الربح'], '−', ['common stock dividends', 'توزيعاتُ العاديّ']], '!pfd,com')
             + AN([['all of the net profit', 'صافي الربح كلُّه']], '!pfd,!com'), 're', 'fsHueC')
      + '</tbody>';
    // THE BOOK'S OWN FILLED EXAMPLE, on the same page as the skeleton it is
    // drawn on: labels and amounts, no numbered step and no rule. It is on
    // this fixture because `settle` walks every statement on the page, and
    // the first version took this one's double rule off and, finding no
    // numbered row to give it back to, left it with none
    const example = '<div class="finStmtWrap fsFrame" data-when="household">'
      + '<table class="finStmt"><caption><span class="fsCo">Jan and Jon Smith</span>'
      + '<span class="fsTitle">Income and Expense Statement</span></caption><tbody>'
      + '<tr><td class="acct">Income</td><td class="n"></td></tr>'
      + '<tr><td class="acct in1">Salaries</td><td class="n">$91,500</td></tr>'
      + '<tr class="tot"><td class="acct">(1) Total income</td><td class="n u">$91,815</td></tr>'
      + '<tr class="tot"><td class="acct">(3) Cash surplus (or deficit)</td><td class="n d">$3,675</td></tr>'
      + '</tbody></table></div>';
    // TWO LADDERS UNDER ONE HEAD, which is what a balance sheet is: each
    // half numbers its own steps from one, and the head names whose the
    // statement is once rather than twice
    const pair = '<div class="finStmtWrap fsFrame" data-when="pair">'
      + '<div class="fsHead"><span class="fsCo">Company’s name</span>'
      + '<span class="fsTitle">Balance Sheet</span></div>'
      + '<div class="eqPair">'
      + '<div class="eqSide"><div class="eqSideHead">Assets<small>الأصول</small></div>'
      +   '<table class="finStmt"><tbody>'
      +   TR(C1('0.', 'u') + C2('Total current assets', 'u') + C3(AN([['cash', 'النقد'], '+', ['inventories', 'المخزون']]), 'u'), 'tot')
      +   TR(C1('0.') + C2('Total assets') + C3(AN([['current assets', 'المتداولة'], '+', ['net fixed assets', 'الثابتة']])), 'tot')
      +   '</tbody></table></div>'
      + '<div class="eqSide"><div class="eqSideHead">Liabilities and equity<small>الخصوم وحقوق الملكيّة</small></div>'
      +   '<table class="finStmt"><tbody>'
      +   TR(C1('0.', 'u') + C2('Total liabilities', 'u') + C3(AN([['current', 'المتداولة'], '+', ['long-term', 'طويلةِ الأجل']]), 'u'), 'tot')
      +   TR(C1('0.') + C2('Total equity') + C3(AN([['common stock', 'الأسهمُ العاديّة'], '+', ['retained earnings', 'المحتجزة']])), 'tot')
      +   TR(C1('0.') + C2('Total liabilities and equity') + C3(AN([['liabilities', 'الخصوم'], '+', ['equity', 'حقوقُ الملكيّة']])), 'tot')
      +   '</tbody></table></div></div></div>';
    const household = '<tbody>'
      + TR(C1('Income' + AR('الدخل'), 'u', 2) + C2('Salaries and wages' + AR('الرواتبُ والأجور'), 'u', 1) + C3(MS, 'u'))
      + TR(C2('Other income' + AR('دخلٌ آخر'), '', 1) + C3(MS))
      + step('Total income' + AR('إجماليُّ الدخل'), AN(['Σ', ['income', 'بنودُ الدخل']]))
      + '</tbody>';
    const frame = (when, co, title, body) => '<div class="finStmtWrap fsFrame" data-when="' + when + '">'
      + '<table class="finStmt"><caption><span class="fsCo">' + co + '</span>'
      + '<span class="fsTitle">' + title + '</span></caption>'
      + '<thead><tr><th class="c1">#</th><th class="c2"></th><th class="c3"></th></tr></thead>'
      + body + '</table></div>';
    // a choice says itself twice, like every line of the statement does -
    // and wears the colour of the lines it will bring
    const opt = (pick, label, arabic, on, hue) => '<span class="fsOpt' + (hue ? ' ' + hue : '')
      + '" data-pick="' + pick + '"'
      + (on ? ' data-on="1"' : '') + '>' + label + AR(arabic) + '</span>';
    const why = '<span class="fsWhyBtn">؟</span>'
      + '<div class="fsWhy"><div class="exp">A company measures <b>profit</b>; a household measures '
      + '<b>cash</b>.</div><div class="exp">فقاعُ قائمةِ الشركة مملوكٌ لأحد، وقاعُ قائمةِ الأسرة فائضٌ أو عجز.</div></div>';
    const page = '<div class="eqPage">'
      + '<div class="fsAsk" data-ask="who" data-mode="one">' + why
      +   '<div class="fsQ">Whose statement?' + AR('قائمةُ مَن؟') + '</div>'
      +   opt('company', 'A company', 'شركة', true) + opt('household', 'A household', 'أسرة')
      +   opt('pair', 'A balance sheet', 'قائمةُ المركز') + '</div>'
      + '<div class="fsAsk" data-ask="profit" data-when="company">'
      +   '<div class="fsQ">What has a share of the net profit after taxes?' + AR('ما الذي له نصيب؟') + '</div>'
      +   opt('pfd', 'The preferred stockholders', 'الأسهمُ الممتازة', false, 'fsHueA')
      +   opt('com', 'The common stockholders', 'الأسهمُ العاديّة', false, 'fsHueB')
      +   opt('re', 'The company itself', 'الشركةُ نفسُها', false, 'fsHueC') + '</div>'
      + frame('company', 'Company’s name', 'Income Statement', company)
      + frame('household', 'Household’s name', 'Income and Expense Statement', household)
      + example + pair
      + '</div>';

    // ---- 1  THE GATE KEEPS THE QUESTION, ITS CHOICES AND THEIR WIRING
    const gated = S.gate(page);
    const held = document.createElement('div'); held.innerHTML = gated;
    say(held.querySelectorAll('.fsAsk').length === 2, 'the gate kept both questions: ' + held.querySelectorAll('.fsAsk').length);
    say(held.querySelectorAll('.fsQ').length === 2, 'and the wording of each');
    say(held.querySelectorAll(".fsOpt").length === 6, "and all six choices: " + held.querySelectorAll('.fsOpt').length);
    say([...held.querySelectorAll('.fsOpt')].every(x => x.getAttribute('data-pick')),
      'each choice still says what it turns on');
    say(held.querySelectorAll('[data-when]').length === page.split('data-when="').length - 1,
      'and every row and rule still says when it belongs: ' + held.querySelectorAll('[data-when]').length);
    say(held.querySelector('.fsAsk[data-mode="one"]') && held.querySelector('.fsOpt[data-on]'),
      'and the question that takes one answer, and the author’s opening position');
    say(Boolean(held.querySelector('.fsWhyBtn')) && Boolean(held.querySelector('.fsWhy')),
      'and the box in the corner with the panel it opens');
    say(held.querySelectorAll(".fsOpt .fsAr").length === 6, "and the Arabic word under every choice: "
      + held.querySelectorAll('.fsOpt .fsAr').length);
    // and a stored `on` is still dropped: the author says `data-on`, the
    // reader says press, and NEITHER is a stored class
    const dirty = S.gate('<div class="fsAsk"><span class="fsOpt on" data-pick="x">y</span></div>');
    say(!/class="[^"]*\bon\b/.test(dirty), 'a stored `on` is dropped, so only the paper lights a choice');

    // ---- 2  THE SHEET'S OWN STYLESHEET, FETCHED
    const css = await (await fetch('../docs/%F0%9F%93%9ATermBoard/F-End/TermSheet.css?t=' + Date.now())).text();
    document.head.appendChild(Object.assign(document.createElement('style'), { textContent: css }));
    host.innerHTML = '<div class="msheet msheet-law">' + gated + '</div>';
    const sheet = host.querySelector('.msheet');
    void host.offsetHeight;

    // ---- 3  THE OPENING POSITION, from the author and not from the store
    P.decide(sheet);
    const lit = () => [...sheet.querySelectorAll('.fsOpt.on')].map(x => x.getAttribute('data-pick')).sort().join(',');
    // DISTINCT, because a view may hold more than one statement: the
    // household's skeleton and the book's filled example stand together
    const shown = () => [...new Set([...sheet.querySelectorAll('.finStmtWrap')].filter(f => !f.hidden)
      .map(f => f.getAttribute('data-when')))].join(',');
    // the LADDER, which is the one with numbered steps - not the example
    const table = () => [...sheet.querySelectorAll('.finStmtWrap:not([hidden]) table.finStmt')]
      .find(t => t.querySelector('td.c1'));
    const rungs = () => [...table().querySelectorAll('tbody tr')].filter(r => !r.hidden)
      .map(r => { const c = r.querySelector('td.c1:not(.lbl)'); return c ? c.textContent.trim() : ''; })
      .filter(Boolean);
    const badges = () => [...table().querySelectorAll('tbody .an')].filter(a => !a.hidden && !a.closest('tr').hidden)
      .map(a => a.querySelector(':scope > b').textContent);
    const bottom = () => { const d = table().querySelector('td.d'); return d ? d.closest('tr').querySelector('td.c2').textContent.split('(')[0].trim() : '(none)'; };
    const lastWord = t => t.replace(/[؀-ۿ\s]+$/, '').trim();
    // the first line of an element, which is the English one - a Range over
    // the whole of it would take the Arabic word in with it
    const firstLine = el => { const r = document.createRange(); r.setStart(el, 0); r.setEnd(el, 1);
      return r.getBoundingClientRect(); };

    say(lit() === 'company', 'the page opens where the author left it: ' + lit());
    say(shown() === 'company', 'so the company’s statement is the one drawn: ' + shown());
    say(sheet.querySelector('.fsAsk[data-ask="profit"]').hidden === false,
      'and the question about its profit is asked');

    // ---- 4  THE LADDER WITH NOTHING DECIDED
    const seq = n => Array.from({ length: n }, (_, i) => (i + 1) + '.');
    say(rungs().join(' ') === seq(6).join(' '), 'six rungs, numbered 1 to 6 with no gap: ' + rungs().join(' '));
    say(badges().join('') === '123456', 'and six rules, numbered as their own sequence: ' + badges().join(''));
    say(/Earnings per share/.test(lastWord(bottom())), 'and the bottom line is EPS: ' + lastWord(bottom()));
    say([...table().querySelectorAll('tbody tr')].filter(r => !r.hidden)
             .every(r => r.querySelectorAll('.an:not([hidden])').length <= 1),
      'and no line shows two rules at once');
    // the EPS rule reads from the net profit, there being nothing above it
    const eps = () => [...table().querySelectorAll('tbody tr')]
      .find(r => !r.hidden && /Earnings per share/.test(r.textContent));
    say(/net profit/.test(eps().querySelector('.an:not([hidden])').textContent),
      'and it divides the NET PROFIT, there being no preferred slice taken out');

    // ---- 5  PAID TO THE PREFERRED HOLDERS
    const press = pick => {
      const o = sheet.querySelector('.fsOpt[data-pick="' + pick + '"]');
      const ask = o.closest('.fsAsk');
      if (ask.getAttribute('data-mode') === 'one') ask.querySelectorAll('.fsOpt').forEach(x => x.classList.toggle('on', x === o));
      else o.classList.toggle('on');
      P.settle(sheet);
    };
    press('pfd');
    say(rungs().join(' ') === seq(7).join(' '), 'the preferred slice adds a rung: ' + rungs().join(' '));
    say(badges().join('') === '1234567', 'and a rule with it: ' + badges().join(''));
    say(/earnings available/.test(eps().querySelector('.an:not([hidden])').textContent),
      'and EPS now divides what is LEFT for the common holders');
    say(eps().querySelectorAll('.an:not([hidden])').length === 1, 'and only that one reading of it is showing');
    say(/Earnings per share/.test(lastWord(bottom())), 'the bottom line is still EPS: ' + lastWord(bottom()));

    // ---- 6  AND TO THE COMMON HOLDERS, AT THE SAME TIME
    press('com');
    say(lit() === 'com,company,pfd', 'two answers to one question stand together: ' + lit());
    say(rungs().join(' ') === seq(8).join(' '), 'and the ladder is eight rungs: ' + rungs().join(' '));
    say(/Dividends per share/.test(lastWord(bottom())), 'and the bottom line has moved to DPS: ' + lastWord(bottom()));

    // ---- 7  AND WHAT IS LEFT IS KEPT
    press('re');
    say(rungs().join(' ') === seq(9).join(' '), 'the retained line is the ninth rung: ' + rungs().join(' '));
    const re = () => [...table().querySelectorAll('tbody tr')]
      .find(r => !r.hidden && /retained earnings/.test(r.textContent));
    say(re().querySelectorAll('.an:not([hidden])').length === 1,
      'and it carries exactly one of its four rules: ' + re().querySelectorAll('.an:not([hidden])').length);
    const reads = () => re().querySelector('.an:not([hidden])').textContent;
    say(/preferred/.test(reads()) && /common/.test(reads()),
      'the one that takes BOTH dividends out: ' + reads().replace(/[؀-ۿ]/g, '').replace(/\s+/g, ' ').trim());
    say(/retained earnings/.test(lastWord(bottom())), 'and the bottom line is now the retained line');

    // ---- 8  TAKE THE PREFERRED DECISION BACK, AND EVERYTHING FOLLOWS
    press('pfd');
    say(rungs().join(' ') === seq(8).join(' '), 'the ladder closes up with no gap: ' + rungs().join(' '));
    say(!/preferred/.test(reads()) && /common/.test(reads()),
      'and the retained rule is the one for common dividends alone: '
      + reads().replace(/[؀-ۿ]/g, '').replace(/\s+/g, ' ').trim());
    say(/net profit/.test(eps().querySelector('.an:not([hidden])').textContent),
      'and EPS is back to dividing the net profit');
    say([...table().querySelectorAll('tbody tr')].filter(r => !r.hidden)
         .every(r => r.querySelectorAll('.an:not([hidden])').length <= 1),
      'and still no line shows two rules');

    // ---- 9  A WHOLE OTHER STATEMENT, AND THE QUESTION THAT DOES NOT APPLY
    press('household');
    say(shown() === 'household', 'the household’s statement takes its place: ' + shown());
    say(sheet.querySelector('.fsAsk[data-ask="profit"]').hidden === true,
      'and a company’s question is not asked of a household');
    say(/Household/.test(table().querySelector('.fsCo').textContent), 'and the head names whose it is');
    // ONE numbered rung here: the two income lines are gathered by a brace
    // and carry no step of their own, exactly as the operating expenses do
    say(rungs().join(' ') === seq(1).join(' '), 'and its own rungs are numbered from one: ' + rungs().join(' '));
    say(table().querySelector('td.c1.lbl') && table().querySelector('td.c1.lbl').getAttribute('rowspan') === '2',
      'its brace still spans the lines it gathers');
    // AND THE BOOK'S FILLED EXAMPLE, which is on the page too, is not a
    // ladder and must be left exactly as it was written
    const filled = [...sheet.querySelectorAll('.finStmtWrap')]
      .find(f => !f.hidden && f.querySelector('td.acct'));
    say(Boolean(filled), 'the book’s own filled example stands beside the skeleton');
    const ruled = filled.querySelector('td.d');
    say(Boolean(ruled) && /3,675/.test(ruled.textContent),
      'and keeps the bottom line it was written with: ' + (ruled ? ruled.textContent : '(stripped)'));
    say(getComputedStyle(ruled).borderBottomStyle === 'double', 'ruled twice, as a bottom line is');
    say(!filled.querySelector('td.c1'), 'it carries no numbered step, which is why it is left alone');
    // ---- 9b  TWO LADDERS UNDER ONE HEAD: a balance sheet
    press('pair');
    say(shown() === 'pair', 'a statement drawn as two halves takes its turn: ' + shown());
    const halves = [...sheet.querySelectorAll('.finStmtWrap:not([hidden]) table.finStmt')];
    say(halves.length === 2, 'it is two ladders, not one: ' + halves.length);
    const stepsIn = t => [...t.querySelectorAll('tbody tr')].filter(r => !r.hidden)
      .map(r => { const c = r.querySelector('td.c1:not(.lbl)'); return c ? c.textContent.trim() : ''; }).filter(Boolean);
    // EACH HALF FROM ONE. The order of doing belongs to the half, and a
    // right-hand side that began at three would read as the left one's tail
    say(stepsIn(halves[0]).join(' ') === '1. 2.' && stepsIn(halves[1]).join(' ') === '1. 2. 3.',
      'and each numbers its own steps from one: ' + stepsIn(halves[0]).join(' ') + ' | ' + stepsIn(halves[1]).join(' '));
    const bothEnds = halves.map(t => { const d = t.querySelector('td.d');
      return d ? d.closest('tr').querySelector('td.c2').textContent.trim() : '(none)'; });
    say(bothEnds.every(x => x !== '(none)'), 'and each half is ruled twice where it ends: ' + bothEnds.join(' | '));
    // and the head stands over BOTH, with the caption's own ground
    const oneHead = sheet.querySelector('.finStmtWrap:not([hidden]) .fsHead');
    say(Boolean(oneHead), 'one head stands over the pair');
    const hb = oneHead.getBoundingClientRect(), pairBox = sheet.querySelector('.finStmtWrap:not([hidden]) .eqPair').getBoundingClientRect();
    say(hb.bottom <= pairBox.top + 1, 'above both halves, not inside either');
    say(getComputedStyle(oneHead).textAlign === 'center', 'centred over them');
    const headGround = getComputedStyle(oneHead).backgroundColor;
    say(!/rgba\(0, 0, 0, 0\)|transparent/.test(headGround),
      'and laid on the same ground a caption is: ' + headGround);
    say(Boolean(oneHead.querySelector('.fsCo')) && Boolean(oneHead.querySelector('.fsTitle')),
      'naming whose it is and what it is, once and not twice');
    say(halves.every(t => !t.querySelector('caption')), 'and neither half carries a head of its own');
    // AND THE BOX TAKES THE PAGE'S WIDTH, NOT ITS OWN CONTENTS'. A framed
    // pair that shrinks to fit squeezed the balance sheet into half the
    // paper, put a scrolling bar under it and wrapped every label onto two
    // lines - while looking, at a glance, perfectly deliberate
    const pairFrame = sheet.querySelector('.finStmtWrap.fsFrame:not([hidden])');
    const fw = pairFrame.getBoundingClientRect().width, pw = sheet.getBoundingClientRect().width;
    say(fw >= pw * 0.9, 'the box takes the width of the page: ' + Math.round(fw) + ' of ' + Math.round(pw));
    say(pairFrame.scrollWidth <= pairFrame.clientWidth + 2,
      'and nothing in it is pushed out of sight: ' + pairFrame.scrollWidth + ' inside ' + pairFrame.clientWidth);
    const sideBoxes = [...pairFrame.querySelectorAll('.eqSide')].map(s => s.getBoundingClientRect());
    say(halves.every((t, i) => t.getBoundingClientRect().right <= sideBoxes[i].right + 1),
      'and neither half spills past its own side');
    // AND THE TWO HALVES SPLIT THE BOX. The unframed pair on Ch2 was
    // composed against an 800px sheet and its columns are that wide BY HAND;
    // inside a box told to take the whole page those fixed columns left half
    // of it empty, and the right-hand table ran out past its own side
    // MEASURED IN ONE UNIT. `getBoundingClientRect` is in CSS pixels and
    // `clientWidth` in the element's own - and under `zoom` those differ by
    // half, so the first reading of this called a correct layout broken
    const pairRect = pairFrame.querySelector('.eqPair').getBoundingClientRect();
    const frameBox = pairFrame.getBoundingClientRect();
    say(pairRect.width >= frameBox.width * 0.9,
      'the pair fills the box: ' + Math.round(pairRect.width) + ' of ' + Math.round(frameBox.width));
    say(sideBoxes[0].width + sideBoxes[1].width >= pairRect.width - 2,
      'and the halves divide it between them: ' + Math.round(sideBoxes[0].width) + ' + '
      + Math.round(sideBoxes[1].width) + ' of ' + Math.round(pairRect.width));
    say(Math.abs(sideBoxes[0].width - sideBoxes[1].width) <= 1, 'and they divide it equally');

    press('company');
    say(shown() === 'company' && rungs().join(' ') === seq(8).join(' '),
      'and going back finds the company’s ladder as it was left: ' + rungs().join(' '));

    // ---- 10  A CHOSEN OPTION LOOKS CHOSEN
    const chosenOne = sheet.querySelector('.fsOpt.on'), coldOne = sheet.querySelector('.fsOpt:not(.on)');
    const cs = getComputedStyle(chosenOne), cold = getComputedStyle(coldOne);
    say(cs.backgroundColor !== cold.backgroundColor,
      'a chosen choice is not the colour of an unchosen one: ' + cs.backgroundColor + ' vs ' + cold.backgroundColor);
    // A TICK AND NOT ONLY A COLOUR: two of these can be on at once, which
    // a lit tab never is, so the look must say `chosen` and not `current`
    const tick = getComputedStyle(chosenOne, '::before').content;
    say(/2713|✓/.test(tick) || tick.indexOf('✓') > -1, 'and it wears a tick: ' + tick);
    say(getComputedStyle(sheet.querySelector('.fsAsk')).justifyContent === 'center', 'the question is centred');
    const q = sheet.querySelector('.fsQ'), first = sheet.querySelector('.fsOpt');
    say(q.getBoundingClientRect().bottom <= first.getBoundingClientRect().top + 1,
      'and its wording stands above the choices');
    // AND A CHOICE SAYS ITSELF TWICE. `household` is not a word a reader
    // of the Arabic summary knows, and a pill is where he first meets it
    const gloss = first.querySelector('.fsAr');
    say(Boolean(gloss) && [...sheet.querySelectorAll('.fsOpt')].every(x => x.querySelector('.fsAr')),
      'every choice carries its own Arabic word');
    say(getComputedStyle(gloss).display === 'block' && getComputedStyle(gloss).textAlign === 'center',
      'under the English and centred on it: ' + getComputedStyle(gloss).textAlign);
    const gr = gloss.getBoundingClientRect(), er = firstLine(first);
    say(gr.top >= er.bottom - 1, 'and below it, not beside it: ' + Math.round(gr.top - er.bottom) + 'px down');

    // ---- 11  THE BOX IN THE CORNER, AND THE PANEL IT OPENS
    const ask = sheet.querySelector('.fsAsk[data-ask="who"]');
    const btn = ask.querySelector('.fsWhyBtn'), panel = ask.querySelector('.fsWhy');
    say(Boolean(btn) && Boolean(panel), 'the first question carries a box and a panel');
    // CLOSED ON ARRIVAL, and that is the engine's doing: `hidden` does not
    // survive the gate, so `decide` is the only thing that can close it
    say(panel.hidden === true, 'the panel is closed when the page is drawn');
    say(getComputedStyle(panel).display === 'none', 'and the stylesheet really hides it');
    const ar2 = ask.getBoundingClientRect(), br2 = btn.getBoundingClientRect();
    say(getComputedStyle(btn).position === 'absolute', 'the box is taken out of the flow');
    say(Math.abs(br2.right - ar2.right) < 24 && Math.abs(br2.top - ar2.top) < 24,
      'and sits in the corner of the question: ' + Math.round(ar2.right - br2.right) + 'px in, '
      + Math.round(br2.top - ar2.top) + 'px down');
    // OPENED, and measured where it lands: a POP-IN takes its place in the
    // page under the choices. A window over the statement would hide the
    // very thing the question is about
    panel.hidden = false;
    void sheet.offsetHeight;
    const pr = panel.getBoundingClientRect();
    say(getComputedStyle(panel).display !== 'none', 'pressed open, it is drawn');
    say(pr.top >= first.getBoundingClientRect().bottom - 1,
      'under the choices and not over them: ' + Math.round(pr.top - first.getBoundingClientRect().bottom) + 'px below');
    const stmt = sheet.querySelector('.finStmtWrap:not([hidden])').getBoundingClientRect();
    say(pr.bottom <= stmt.top + 1, 'and above the statement, covering none of it');
    say(pr.width >= ar2.width - 24, 'and it takes the width of the question: ' + Math.round(pr.width));
    panel.hidden = true;

    // ---- 12  A CHOICE AND ITS LINES WEAR ONE COLOUR
    // Everything must be showing for this. Said as `make it so` and not as
    // three presses: by here the earlier sections have left two of them on
    // already, and three blind presses would turn those two back off
    const hueOf = el => getComputedStyle(el).getPropertyValue('--hue').trim();
    const ensure = (pick, want) => {
      const p = sheet.querySelector('.fsOpt[data-pick="' + pick + '"]');
      if (p.classList.contains('on') !== want) press(pick);
    };
    ['pfd', 'com', 're'].forEach(p => ensure(p, true));
    const pillOf = pick => sheet.querySelector('.fsOpt[data-pick="' + pick + '"]');
    const rowsFor = pick => [...table().querySelectorAll('tbody tr')]
      .filter(r => !r.hidden && r.getAttribute('data-when') === pick);
    const three = ['pfd', 'com', 're'];
    say(three.every(p => hueOf(pillOf(p))), 'each of the three choices has a colour of its own: '
      + three.map(p => hueOf(pillOf(p))).join(' / '));
    say(new Set(three.map(p => hueOf(pillOf(p)))).size === 3, 'and no two of them are the same colour');
    say(three.every(p => rowsFor(p).length > 0), 'each brings lines with it: '
      + three.map(p => p + '=' + rowsFor(p).length).join(' '));
    // THE TIE ITSELF: the pill and every row it shows read the SAME variable,
    // not two hex codes that agree until one of them is edited
    const tied = three.every(p => rowsFor(p).every(r => hueOf(r) === hueOf(pillOf(p))));
    say(tied, 'and every line it brings reads the same colour as the button that brought it');
    say(three.every(p => {
      const bg = getComputedStyle(rowsFor(p)[0].querySelector('td')).backgroundColor;
      return bg && !/rgba\(0, 0, 0, 0\)|transparent/.test(bg);
    }), 'the lines are really laid on it: '
      + three.map(p => getComputedStyle(rowsFor(p)[0].querySelector('td')).backgroundColor).join(' / '));
    say(new Set(three.map(p => getComputedStyle(rowsFor(p)[0].querySelector('td')).backgroundColor)).size === 3,
      'and three different grounds, one per decision');
    // a chosen pill is painted its own colour, not the page's blue
    const litPill = pillOf('pfd');
    say(getComputedStyle(litPill).backgroundColor !== getComputedStyle(pillOf('company')).backgroundColor,
      'a chosen choice is painted ITS colour, not the one the page lights tabs with');
    // AND WHAT IS ALWAYS THERE WEARS NONE: a rung nobody decided on is not
    // a decision, and colouring it would say it was
    const always = [...table().querySelectorAll('tbody tr')]
      .filter(r => !r.hidden && !r.getAttribute('data-when'));
    say(always.length > 0 && always.every(r => !/fsHue/.test(r.className)),
      'the ladder that always stands wears no hue at all: ' + always.length + ' rows');
    // and the reading of EPS that the preferred decision brings is hued
    // though its rung is not
    const epsTag = eps().querySelector('.an:not([hidden])');
    say(/fsHue/.test(epsTag.className) && hueOf(epsTag) === hueOf(pillOf('pfd')),
      'but the reading of EPS that the preferred decision brings is its colour');
    ['pfd', 'com', 're'].forEach(p => ensure(p, false));

    // ---- 13  AND THE STATEMENT IS DRAWN SMALL ENOUGH TO WATCH IT CHANGE
    // Measured as a RATIO against the same markup at full size, because a
    // number in the stylesheet proves only that the number is written
    const frame2 = sheet.querySelector('.finStmtWrap:not([hidden])');
    const small = frame2.getBoundingClientRect().height;
    frame2.style.setProperty('--fsSize', '1');
    void sheet.offsetHeight;
    const full = frame2.getBoundingClientRect().height;
    frame2.style.removeProperty('--fsSize');
    void sheet.offsetHeight;
    // NOT a ratio of exactly two: at half size the frame has twice the room
    // in its own units, so long lines wrap less and it comes out shorter
    // still. What matters is that it is drawn at most half as tall
    // The ratio is not exactly two in either direction: at half size the
    // frame has twice the room in its own units, so lines wrap differently -
    // measured between 1.9 and 2.9 depending on how long the ladder is
    say(small > 0 && full > 0 && full / small >= 1.8,
      'the statement is drawn at about half the height: ' + Math.round(small) + 'px against '
      + Math.round(full) + ' at full, a ratio of ' + (full / small).toFixed(2));
    say(String(getComputedStyle(frame2).zoom) === '0.5',
      'and the one number that says so is `--fsSize`: zoom ' + getComputedStyle(frame2).zoom);
    // AND THE CHOICES ARE NOT SHRUNK WITH IT: they are what is read and
    // pressed while the statement moves under them
    say(parseFloat(getComputedStyle(first).fontSize)
        > parseFloat(getComputedStyle(frame2.querySelector('td.c2')).fontSize) * 0.9,
      'while the choices stay their own size: ' + getComputedStyle(first).fontSize
      + ' against ' + getComputedStyle(frame2.querySelector('td.c2')).fontSize + ' in the ladder');

    o.textContent = (faults.length ? 'FAIL ' + faults.length + ' fault(s)' : 'OK')
      + ' (' + out.length + ' checks)\n' + out.join('\n');
  })().catch(e => {
    document.getElementById('o').textContent = 'FAIL the guard itself threw: ' + e + '\n' + (e && e.stack);
  });
</script>
