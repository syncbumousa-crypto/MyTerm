<!doctype html>
<meta charset="utf-8">
<title>Guard · the folder on a question</title>
<style>
  #host { width: 460px; --sheetScale: 1; }
  .msheet { width: 440px; border: 1px solid #ccc; margin: 6px 0; }
  .qcard { height: 50px; }
</style>
<pre id="o">pending</pre>
<div id="host"></div>
<script src="../docs/%F0%9F%93%9ATermBoard/B-End/TermInkStore.js"></script>
<script src="../docs/%F0%9F%93%9ATermBoard/F-End/TermInkPad.js"></script>
<script src="../docs/%F0%9F%93%9ATermBoard/F-End/TermSolShelf.js"></script>
<script>
  // THE SAME TRAP AS THE PICTURES ON A SHEET, AND IT IS CHECKED FIRST:
  // `shape()` rebuilds the record field by field and drops what it does
  // not know, so a shelf written without being named there is wiped on
  // the next load without a sound. Check one is the round trip.
  //
  // The second is that the folder belongs to the QUESTION and not to an
  // attempt: sealing, emptying or deleting an attempt sheet must leave
  // the photographs standing. The reader's worked answer is not a draft
  // of his handwriting.
  //
  // The third is the dates, because they are the whole of what he asked
  // to see on opening it.
  window.onerror = (m, s, l, c) => {
    document.getElementById('o').textContent = 'FAIL ' + m + ' @' + l + ':' + c;
    return true;
  };
  (async function(){
    const o = document.getElementById('o');
    const host = document.getElementById('host');
    const faults = [], out = [];
    const S = window.MyTermInkStore, P = window.MyTermInkPad, F = window.MyTermSolShelf;
    if (!S || !F) { o.textContent = 'FAIL the shelf did not load'; return; }
    if (!S.addSol || !S.sols) { o.textContent = 'FAIL the store knows nothing of a shelf'; return; }

    const bin = new Map();
    S.useShelf({ name: 'the guard’s own shelf',
      get: async k => (bin.has(k) ? JSON.parse(bin.get(k)) : null),
      put: async (k, v) => { bin.set(k, JSON.stringify(v)); return true; } });
    S.useCloud({ name: 'no cloud', ready: () => false, list: async () => [], find: async () => null,
                 folder: async () => '', make: async () => null, read: async () => null, write: async () => false });
    // The pop-in has no geometry without the sheet that styles it, and a
    // check on a stage with no height measures nothing
    {
      const css = await (await fetch('../docs/%F0%9F%93%9ATermBoard/F-End/TermBoard.css?t=' + Date.now())).text();
      document.head.appendChild(Object.assign(document.createElement('style'), { textContent: css }));
    }
    await S.open('c-sol', 'h-sol');

    const card = document.createElement('div');
    card.className = 'msheet msheet-card';
    card.dataset.group = 'rules1'; card.dataset.at = '0';
    card.innerHTML = '<div class="qcard">a question</div>';
    host.append(card);
    P.arm(host); await P.mount();
    F.arm(host); F.mount();

    const key = 'rules1#0';
    const say = (ok, txt) => { out.push((ok ? 'PASS ' : 'FAIL ') + txt); if (!ok) faults.push(txt); };

    // A PICTURE PER COLOUR. Three copies of one image cannot prove which
    // of them the window is showing - the first run of this guard passed
    // a check that compared an image with itself
    const shot = col => {
      const c = document.createElement('canvas'); c.width = 30; c.height = 20;
      const g = c.getContext('2d'); g.fillStyle = col; g.fillRect(0, 0, 30, 20);
      return c.toDataURL('image/png');
    };
    const tiny = shot('#0a0'), tiny2 = shot('#a00'), tiny3 = shot('#00a');

    // ---- 1 - ONE BUTTON, AND IT IS ON THE QUESTION
    const btn = host.querySelector('.qcard > .solBtn');
    say(Boolean(btn), 'a button was put on the question');
    say(host.querySelectorAll('.solBtn').length === 1, 'exactly one, not one per draw');
    F.mount(); F.mount();
    say(host.querySelectorAll('.solBtn').length === 1,
      'mounted three times, still ' + host.querySelectorAll('.solBtn').length);

    // ---- 2 - IT SURVIVES THE ROUND TRIP THROUGH shape()
    const a1 = S.addSol(key, { src: tiny, w: 30, h: 20 });
    say(Boolean(a1 && a1.id && a1.ts > 0), 'the store took a picture and stamped it');
    await S.flush();
    const raw = JSON.parse(bin.get(Array.from(bin.keys()).find(k => String(k).indexOf('rules1') >= 0)));
    const kept = (raw || {}).sol || [];
    say(kept.length === 1 && kept[0].src === tiny && kept[0].ts > 0,
      'it survived the shelf and shape(): ' + kept.length + ' kept, stamp ' + (kept[0] ? kept[0].ts > 0 : false));
    say(Number(raw.v) >= 6, 'the record says version ' + raw.v + ' (6 carries a shelf)');

    // ---- 3 - IT IS THE QUESTION'S, NOT AN ATTEMPT'S
    S.add(key, { c: '#12141a', w: 5.5, p: [20, 20, 150, 30, 30, 150, 40, 40, 150] });
    S.seal(key);
    say(S.sols(key).length === 1, 'an attempt sealed, the picture still stands');
    S.clear(key);
    say(S.sols(key).length === 1, 'the page emptied, the picture still stands');
    const sheets = S.sheets(key).length;
    if (sheets > 1) { S.drop(key, 0); say(S.sols(key).length === 1, 'an attempt deleted, the picture still stands'); }
    else { say(true, 'only one attempt, nothing to delete'); }

    // ---- 4 - MORE THAN ONE, NEWEST FIRST ON SCREEN
    S.addSol(key, { src: tiny2, w: 30, h: 20 });
    S.addSol(key, { src: tiny3, w: 30, h: 20 });
    say(S.sols(key).length === 3, 'three pictures in the folder');
    btn.click();
    const wrap = document.querySelector('.solWrap');
    say(Boolean(wrap), 'pressing the button opened the folder');
    // A POP-IN now, not a panel in the sheet: it hangs off the body and
    // covers the page, and the dark around it closes it
    say(Boolean(wrap) && wrap.parentElement === document.body && Boolean(wrap.querySelector('.solCard')),
      'it opened as a window over the page, not a rectangle in it');

    // ---- 5 - THE COUNT ON THE BUTTON IS READ, NOT GUESSED
    say(btn.querySelector('.solN').textContent === '3',
      'the button says ' + btn.querySelector('.solN').textContent);

    // ---- 6 - THE DATES IN THE READER'S OWN WORDS
    const day = 86400000;
    say(/^today /.test(F.when(Date.now())), 'today reads "' + F.when(Date.now()) + '"');
    say(/^yesterday /.test(F.when(Date.now() - day)), 'yesterday reads "' + F.when(Date.now() - day) + '"');
    const old = F.when(Date.now() - 40 * day);
    say(!/^today|^yesterday/.test(old) && old.length > 6, 'older reads "' + old + '"');


    // ---- ONE PICTURE, LARGE, AND ARROWS BETWEEN THEM
    // A thumbnail grid cannot be read, and reading his own working is why
    // he opens this at all. So what is measured is: one picture shown, the
    // newest of them first, and the arrows moving the position.
    const bigs = wrap ? wrap.querySelectorAll('.solBig img') : [];
    say(bigs.length === 1, 'exactly one picture is shown, not a grid: ' + bigs.length);
    const stage = wrap && wrap.querySelector('.solStage');
    say(Boolean(stage) && stage.getBoundingClientRect().height > 200,
      'and it is given real room: ' + Math.round(stage ? stage.getBoundingClientRect().height : 0) + 'px tall');
    const byTime = S.sols(key).slice().sort((x, y) => y.ts - x.ts);
    say(F.at() === 0 && wrap.querySelector('.solBig img').src === byTime[0].src,
      'it opens on the newest of them');
    say(Boolean(wrap.querySelector('.solPrev')) && Boolean(wrap.querySelector('.solNext')),
      'both arrows are there');
    say(/1 of 3/.test(wrap.querySelector('.solPos').textContent),
      'and it says where you are: ' + wrap.querySelector('.solPos').textContent);
    wrap.querySelector('.solNext').click();
    say(F.at() === 1 && wrap.querySelector('.solBig img').src === byTime[1].src,
      'the right arrow moved to the second');
    wrap.querySelector('.solPrev').click();
    wrap.querySelector('.solPrev').click();
    say(F.at() === 2, 'and the left arrow wraps round to the last: ' + (F.at() + 1));
    const d1 = wrap.querySelector('.solWhen').textContent.trim();
    say(d1.length > 0, 'the one on screen carries its date: ' + d1);

    // ---- REMOVING THE ONE ON SCREEN
    // Removed BY THE BUTTON on the window, which is the path the hand
    // takes - and `confirm` is answered yes for the length of it
    const gone = byTime[2].id;
    const realConfirm = window.confirm;
    window.confirm = () => true;
    wrap.querySelector('.solDel').click();
    window.confirm = realConfirm;
    const left = S.sols(key).map(x => x.id);
    say(left.length === 2 && left.indexOf(gone) < 0,
      'the Remove button took that one away: ' + left.length + ' left, and not the removed one');

    // ---- 8 - IT CLOSES, AND PRESSING AGAIN REOPENS
    btn.click();
    say(!document.querySelector('.solWrap'), 'pressing again closed it');
    btn.click();
    say(Boolean(document.querySelector('.solWrap')), 'and once more reopened it');

    // ---- 9 - A SECOND QUESTION HAS ITS OWN FOLDER
    const card2 = document.createElement('div');
    card2.className = 'msheet msheet-card';
    card2.dataset.group = 'rules1'; card2.dataset.at = '1';
    card2.innerHTML = '<div class="qcard">another question</div>';
    host.append(card2);
    await P.mount(); F.mount();
    const btn2 = card2.querySelector('.solBtn');
    say(Boolean(btn2) && btn2.dataset.key === 'rules1#1',
      'the second question got its own folder, keyed ' + (btn2 ? btn2.dataset.key : 'none'));
    say(S.ready('rules1#1') ? S.sols('rules1#1').length === 0 : true,
      'and it is empty - a folder is not shared between questions');

    // ---- 10 - AND A PICTURE ALONE IS WORTH SENDING
    // Reported: a picture added on one machine was not on the laptop. Two
    // places asked whether a sheet held STROKES before sending anything,
    // so a card whose whole answer was a photograph never got a file in
    // Drive at all. This is the check for it.
    const k2 = 'rules1#7';
    await S.load(k2);
    S.addSol(k2, { src: tiny, w: 30, h: 20 });
    await S.flush();
    say(S.cloudOwed() > 0,
      'a card with a picture and no ink is owed to the cloud (owed=' + S.cloudOwed() + ')');

    // AND HE CAN SEE IT. The notebook carried the `not sent yet` badge and
    // the notebook is hidden now, so this window is the only place that can
    // say it. A debt nobody is told about is the fault all over again.
    F.draw();
    const st = wrap.querySelector('.solSent');
    say(st && !st.hidden && /not sent/.test(st.textContent) && st.classList.contains('owed'),
      'and the window says so: ' + (st ? JSON.stringify(st.textContent) : 'no badge'));

    // ---- 11 - IT GOES TO THE READER'S OWN DRIVE, AND WHERE EXACTLY
    // The live cloud is `window.MyTermCloud`, which carries HIS token - so
    // what can be proved here is the PATH and the PAYLOAD: a folder named
    // `ink` inside the chapter's own folder, one file per card, and the
    // picture inside it. A fake cloud records what the real one would be
    // asked to do.
    const calls = [];
    let madeFolder = 'ink-folder-id';
    const files = new Map();
    S.useCloud({
      name: 'Drive',
      ready: () => true,
      list: async id => { calls.push('list ' + id); return []; },
      find: async (parent, name) => { calls.push('find ' + parent + '/' + name); return null; },
      folder: async (name, parent) => { calls.push('folder ' + name + ' in ' + parent); return madeFolder; },
      make: async (parent, name, body) => {
        calls.push('make ' + name + ' in ' + parent);
        files.set(name, body); return 'file-' + name;
      },
      read: async id => null,
      write: async (id, body) => { calls.push('write ' + id); return true; }
    });
    S.attach('chapter-folder-id');
    const k3 = 'rules1#5';
    await S.load(k3);
    S.addSol(k3, { src: tiny, w: 30, h: 20 });
    await S.flush();
    await S.push();
    const name = 'ink-rules1-5.json';
    say(calls.some(c => c === 'folder ink in chapter-folder-id'),
      'it asked for an `ink` folder inside the chapter folder');
    say(files.has(name), 'and wrote one file for the card: ' + name);
    const body = files.get(name) || {};
    const sent = ((body.sol || [])[0] || {});
    say(sent.src === tiny, 'the picture itself is in what went up');
    say(Number(body.pr) > 0 && Number(body.pr) === Number(body.rev),
      'and it is marked as having reached Drive (rev ' + body.rev + ' = pr ' + body.pr + ')');

    o.textContent = (faults.length ? 'FAIL ' + faults.length + ' fault(s)' : 'OK') + '\n' + out.join('\n');
  }).call(null).catch(e => { document.getElementById('o').textContent = 'THREW ' + (e && e.stack || e); });
setTimeout(() => { var p = document.getElementById('o'); if (p.textContent === 'pending') p.textContent = 'HUNG - never finished'; }, 12000);
</script>
