<style>
/* Layout: graph paper (chalkboard in dark). One hand-drawn scene: Mohammed on the right,

:root{

  --blue:#1d4fc4; --green:#16784a; --red:#c23a25; --hl:rgba(255,206,40,.45); --c-bond:#1d4fc4; --c-dep:#7a3fb0; --c-loan:#b8660b; --c-inst:#0d7f86; --c-eq:#b02a78;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1b2420; --grid:#24302a; --ink:#f1f4ee; --faint:#a9b8ae; --box:#202b26;
  --blue:#93bbff; --green:#8ee3ab; --red:#ff9d88; --hl:rgba(255,206,40,.22); --c-bond:#93bbff; --c-dep:#d0a8f5; --c-loan:#f3b866; --c-inst:#7fd6dc; --c-eq:#f59ccd; color-scheme:dark}}
:root[data-theme="dark"]{

body{background:var(--paper);color:var(--ink);font-family:var(--hand);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
.sheet{direction:rtl;max-width:1040px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
p{margin:0}

.bl{color:var(--blue)} .gr{color:var(--green)} .rd{color:var(--red)}

svg .group{fill:none;stroke:var(--faint);stroke-width:1.2;stroke-dasharray:6 6;opacity:.7}

svg .role{stroke-width:1.2} svg rect.lend{fill:var(--green);fill-opacity:.14;stroke:var(--green)} svg rect.borr{fill:var(--red);fill-opacity:.12;stroke:var(--red)} svg text.lend{fill:var(--green)} svg text.borr{fill:var(--red)}

/* cases: dim until Mohammed is tapped */
svg .case{transition:opacity .3s}
svg .case .who:hover{opacity:.8}

.pbox p{margin:0}

function tl(d){

  o+=`<line class="line" x1="20" y1="100" x2="${W-20}" y2="100"/>`;
  d.pts.forEach((p,i)=>{const x=W-m-i*st,[t,dir,parts]=p;

    o+=`<text class="tick" x="${x}" y="198" text-anchor="middle">${t}</text>`;
    const c=parts[0][1], y2=dir>0?44:156, ly=dir>0?32:176;
    o+=`<path class="am" style="stroke:${C[c]}" marker-end="url(#${M[c]})" d="M${x} 100 L${x} ${y2}"/>`;

  return `<svg viewBox="0 0 ${W} 210" role="img" aria-label="Timeline">${o}</svg>`;
}

    <p class="ptag" id="ptag" dir="ltr"></p>
    <div class="mtogs" dir="ltr" role="group" aria-label="طريقة عرض السعر"><button type="button" class="mtog" data-v="b0">B0</button><button type="button" class="mtog" data-v="q">Quote</button></div>
    <p class="pfx" id="pfx" dir="ltr"></p>
  </div>`;}
let view='q';
function wirePrice(d){const bx=document.querySelector('.pbox'); if(!bx)return; const c=cr(d); let cur=c;
  const set=m=>{cur=m;const p=price(c,m);
    document.getElementById('pval').textContent=(p/10).toFixed(1);
    const B=Math.round(p).toLocaleString('en-US'), Q=(p/10).toFixed(1);
    document.getElementById('pfx').innerHTML = view==='q'
      ? `<span class="lw">Quote<small>السعر المُعلَن</small></span><span>=</span><span class="fr"><span>B0<small>سعر السند اليوم</small></span><span class="pm">M<small>القيمة الاسمية</small></span></span><span>× 100</span><span></span>`+`<span></span><span>=</span><span class="fr"><span>${B}</span><span class="pm">1,000</span></span><span>× 100</span><span>= <b class="qres">${Q}</b></span>`
      : `<span class="lw">B0<small>سعر السند اليوم</small></span><span>=</span><span class="fr"><span>Quote<small>السعر المُعلَن</small></span><span>100</span></span><span>× <span class="pm lw" style="display:inline-flex">M<small>القيمة الاسمية</small></span></span><span></span>`+`<span></span><span>=</span><span class="fr"><span>${Q}</span><span>100</span></span><span>× <span class="pm">1,000</span></span><span>= <b class="qres">${B}</b></span>`;
    bx.querySelectorAll('.mtog').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===view));
    const t=document.getElementById('ptag'), b0='B0 = '+Math.round(p).toLocaleString('en-US');
    if(m===c){t.textContent=b0+'\npar';t.className='ptag';}
    else if(m>c){t.textContent=b0+'\ndiscount';t.className='ptag rd';}
    else{t.textContent=b0+'\npremium';t.className='ptag gr';}
    bx.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===m));};
  bx.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>set(+b.dataset.m)));
  bx.querySelectorAll('.mtog').forEach(x=>x.addEventListener('click',()=>{view=x.dataset.v;set(cur);document.querySelectorAll('.story [data-r=bar]').forEach(b=>b.dispatchEvent(new Event('input')));}));
  set(c);}

/* ---------- bond story (configurable: m coupons a year) ---------- */
const TX=[660,470,280,90], BY=300;
const XT=t=>TX[0]+(TX[3]-TX[0])*t/3;
const PY=v=>v<900?212:190-(v-940);
const f0=n=>Math.round(n).toLocaleString('en-US');
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة'];
function mkStory(id,m,N1,N2,SALE){
  const cm=60/m, CPN=[]; for(let k=1;k<=3*m;k++) CPN.push(+(k/m).toFixed(4));
  const RATE=t=>t<N1?6:t<N2?10:4;
  const PR=(t,rr)=>{const r=(rr??RATE(t))/100/m;let p=0;CPN.forEach(T=>{if(T>t+1e-9)p+=(cm+(T===3?1000:0))/Math.pow(1+r,m*(T-t));});return p;};
  const SP=PR(SALE);
  const BRK=[...CPN.map(T=>[T,'cpn']),[N1,'mkt'],[N2,'mkt']].sort((x,y)=>x[0]-y[0]);
  const moC=CPN.filter(T=>T<=SALE).length, khC=CPN.length-moC;
  function curve(t){let o='',a=0;
    for(const [b,k] of BRK){const end=Math.min(t,b);
      if(end>a){let d='';for(let u=a;u<=end+1e-9;u=+(u+0.02).toFixed(2)){const uu=Math.min(u,b-1e-6);d+=(d?'L':'M')+XT(uu).toFixed(1)+' '+PY(PR(uu)).toFixed(1)+' ';}
        const ue=Math.min(end,b-1e-6); d+='L'+XT(ue).toFixed(1)+' '+PY(PR(ue)).toFixed(1); o+=`<path class="cs rise" d="${d}"/>`;}
      if(t>=b-1e-9){const x=XT(b),y1=PY(PR(b-1e-6,RATE(b-1e-6))),y2=PY(PR(b));
        o+=`<path class="cs ${k}" d="M${x} ${y1} L${x} ${y2}"/>`;
        const lab=k==='cpn'?(b===3?'−'+f0(cm+1000):'−'+f0(cm)):(RATE(b)+'%');
        o+=k==='cpn'?`<text class="ev cpn" x="${x+6}" y="${(y1+y2)/2+5}">${lab}</text>`:`<text class="ev mkt" x="${x-7}" y="${(y1+y2)/2+5}" text-anchor="end">${lab}</text>`;}
      a=b; if(t<b)break;}
    return o;}
  const atCpn=t=>CPN.findIndex(T=>t>=T&&t<T+0.08);
  function cap(t){
    if(t<0.03) return `نقطة 0: محمد يعطي البنك 1,000 وياخذ الورقة. السعر 1,000، لأن الـ coupon (6%) = السوق (6%). والـ coupon السنوي 60 ${m>1?`ينقسم على ${m} دفعات، كل دفعة ${f0(cm)}`:'ينصرف مرة وحدة في نهاية السنة'}.`;
    if(t>=3) return `الـ maturity: البنك يدفع لخالد ${f0(cm)} + 1,000، والورقة صارت 0. الخلاصة: محمد استلم ${moC} × ${f0(cm)} + ${f0(SP)} = ${f0(moC*cm+SP)}، وخالد دفع ${f0(SP)} واستلم ${f0(khC*cm+1000)}.`;
    const ci=atCpn(t); if(ci>=0){const who=CPN[ci]<=SALE?'محمد':'خالد';return `الدفعة ${ORD[ci]||''}: ${who} استلم coupon ‎+${f0(cm)}، فنزل السعر ${f0(cm)} مرة وحدة.`;}
    if(t>=N1&&t<N1+0.1) return 'خبر: السوق صار 10%، فورقة محمد اللي تعطي 6% صارت أقل مرغوبة، ونزل سعرها فجأة.';
    if(t>=N2&&t<SALE) return 'خبر: السوق نزل إلى 4%، فورقة محمد صارت أحسن من السندات الجديدة، وطلع سعرها فجأة.';
    if(t>=SALE&&t<SALE+0.1) return `محمد احتاج فلوسه، فباع الورقة لخالد بـ ${f0(SP)}، وهو سعر السوق الحين. هذا الـ secondary market.`;
    const nxt=CPN.find(T=>T>t), last=nxt===3;
    return `الوقت يمر، والسعر يطلع شوي شوي لأن ${last?`آخر دفعة (${f0(cm)} + 1,000)`:`الـ coupon الجاي (${f0(cm)})`} قاعد يقرّب.`;}
  function html(){
    const ticks=TX.map((x,i)=>`<line class="line" x1="${x}" y1="${BY-6}" x2="${x}" y2="${BY+6}"/><text class="tick" x="${x}" y="${BY+24}" text-anchor="middle">${i}</text>`).join('')
      +CPN.filter(T=>T%1).map(T=>`<line class="line" x1="${XT(T)}" y1="${BY-5}" x2="${XT(T)}" y2="${BY+5}"/><text class="tick" x="${XT(T)}" y="${BY+24}" text-anchor="middle" style="font-size:12px">${T}</text>`).join('')
      +[N1,N2].map(T=>`<line class="line" x1="${XT(T)}" y1="${BY-3}" x2="${XT(T)}" y2="${BY+3}" style="opacity:.4"/>`).join('')
      +CPN.map((T,i)=>`<text class="sgot" data-r="g${i}" x="${XT(T)}" y="${BY+46}" text-anchor="middle"></text>`).join('');
    const grid=TX.map(x=>`<line class="cgrid" x1="${x}" y1="56" x2="${x}" y2="${BY}"/>`).join('');
    const kx=XT(SALE);
    return `<div class="story" dir="rtl" id="${id}">
    <svg viewBox="0 0 760 360" dir="ltr" role="img" aria-label="Bond story: drag the bar to move through time and watch the bond price">
      ${grid}
      <line class="cpar" x1="30" y1="${PY(1000)}" x2="750" y2="${PY(1000)}"/>
      <text class="clab" data-r="parl" x="34" y="${PY(1000)-5}">par = 100 (1,000)</text>
      <text class="smk" data-r="mk" x="30" y="24"></text>
      <g data-r="news" class="snews"><rect x="250" y="6" width="300" height="32" rx="8"/><text data-r="newst" x="400" y="28" text-anchor="middle"></text></g>
      <g data-r="segs"></g>
      <line class="line" x1="30" y1="${BY}" x2="750" y2="${BY}"/>${ticks}
      <use href="#bank" x="696" y="${BY-78}" width="64" height="78"/>
      <g data-r="give"><path class="am ar-ink" marker-end="url(#mk)" d="M688 ${BY-42} L700 ${BY-42}"/></g>
      <g data-r="sale"><path class="am ar-ink" marker-end="url(#mk)" d="M${kx+14} ${BY-92} L${kx+44} ${BY-92}"/><text class="slbl" x="${kx+29}" y="${BY-100}" text-anchor="middle">${f0(SP)}</text></g>
      <g data-r="kh" class="smo"><use href="#man" x="-26" y="${BY-78}" width="52" height="78"/><text class="sname" x="0" y="${BY-82}" text-anchor="middle">خالد</text><text class="scoin" data-r="kcoin" x="0" y="${BY-100}" text-anchor="middle"></text></g>
      <g data-r="mo" class="smo"><use href="#man" x="-26" y="${BY-78}" width="52" height="78"/><text class="sname" x="0" y="${BY-82}" text-anchor="middle">محمد</text><text class="scoin" data-r="mcoin" x="30" y="${BY-60}" text-anchor="start"></text></g>
      <g data-r="paper" class="smo"><rect class="spap" x="-54" y="${BY-56}" width="36" height="26" rx="2"/><text class="spapt" data-r="papt" x="-36" y="${BY-39}" text-anchor="middle">BOND</text></g>
      <g data-r="dot"></g>
    </svg>
    <div class="sbar"><input type="range" data-r="bar" min="0" max="3" step="0.01" value="0" dir="rtl" aria-label="الوقت بالسنين"><span class="tval" data-r="tval"></span></div>
    <p class="clegend"><span class="rise">━ الوقت يمر</span> <span class="cpn">━ دفعة انصرفت</span> <span class="mkt">━ السوق تغيّر</span></p>
    <p class="stext" data-r="text"></p>
  </div>`;}
  function wire(){
    const root=document.getElementById(id), $=r=>root.querySelector(`[data-r="${r}"]`), bar=$('bar');
    const draw=()=>{const t=+bar.value, kh=t>=SALE;
      const mx=kh?XT(SALE)+58:XT(t), kx=XT(t);
      $('mo').style.transform=`translate(${mx}px,0)`; $('mo').style.opacity=kh?.35:1;
      $('kh').style.transform=`translate(${kx}px,0)`; $('kh').style.opacity=kh?1:0;
      $('paper').style.transform=`translate(${kh?kx:mx}px,0)`;
      $('give').style.opacity=t<0.03?1:0; $('sale').style.opacity=(t>=SALE&&t<SALE+0.1)?1:0;
      $('mk').textContent=`market rate: ${RATE(t)}%  ·  coupon: 6%  ·  m = ${m}`;
      const nw=(t>=N1&&t<N1+0.1)?'خبر: الفائدة في السوق ارتفعت إلى 10%':(t>=N2&&t<N2+0.1)?'خبر: الفائدة في السوق نزلت إلى 4%':'';
      $('news').style.opacity=nw?1:0; $('newst').textContent=nw;
      $('papt').textContent=t>=3?'PAID':'BOND';
      CPN.forEach((T,i)=>{$('g'+i).textContent=t>=T?('+'+f0(cm)+(T===3?' +1,000':'')):'';});
      const ci=atCpn(t), amt=ci>=0?('+'+f0(cm)+(CPN[ci]===3?' +1,000':'')):'';
      $('mcoin').textContent=(ci>=0&&CPN[ci]<=SALE)?amt:''; $('kcoin').textContent=(ci>=0&&CPN[ci]>SALE)||t>=3?('+'+f0(cm)+(t>=3?' +1,000':'')):'';
      $('segs').innerHTML=curve(t);
      const p=PR(t), c=p>1000.5?'up':p<999.5?'dn':'eq', x=XT(t), y=PY(p);
      $('dot').innerHTML=`<circle class="cdot ${c}" cx="${x}" cy="${y}" r="6"/><text class="cval ${c}" x="${x-10}" y="${y-10}" text-anchor="end">${view==='q'?(p/10).toFixed(1):f0(p)}<tspan class="cb0" dx="4">(${view==='q'?f0(p):(p/10).toFixed(1)})</tspan></text>`;
      $('tval').textContent=`t = ${t.toFixed(2)} سنة`;
      $('parl').textContent=view==='q'?'par = 100 (1,000)':'par = 1,000 (100)';
      $('text').textContent=cap(t);};
    bar.addEventListener('input',draw); draw();}
  return {html,wire};
}
const S1=mkStory('st1',1,1.5,2.5,2.6), S2=mkStory('st2',2,1.25,2.25,2.35);
function show(k){
  const d=D[k], P=d.pl||[['Lender','المسلف','lend'],['Borrower','المستلف','borr']], lr=x=>x==='محمد'?'':'';
  document.getElementById('deal').innerHTML=`
   <div class="row2" dir="ltr">${TY[k]==='bond'?priceBox(d):''}
   <section dir="ltr" class="cert t-${TY[k]}" aria-label="Agreement"><div class="cert-in">
     <p class="cert-top"><svg viewBox="0 0 20 20" aria-hidden="true"><use href="#i-${TY[k]}"/></svg>${d.t}</p>
     <div class="parties">
       <div class="field"><span class="lab">${P[0][0]}</span><span class="val"><span class="who2 ${P[0][2]}">${d.lend}</span></span><span class="ar">${P[0][1]}</span></div>
       <div class="field"><span class="lab">${P[1][0]}</span><span class="val"><span class="who2 ${P[1][2]}">${d.borr}</span></span><span class="ar">${P[1][1]}</span></div>
     </div>
     <div class="cert-grid" style="grid-template-columns:repeat(${d.f.length},minmax(0,1fr))">${d.f.map(f=>`<div class="field"><span class="lab">${f[0]}</span><span class="val ${f[3]}">${f[1]}</span><span class="ar">${f[2]}</span></div>`).join('')}</div>
   </div></section></div>
   ${k==='bbond'?`<div class="duo"><div class="pane"><p class="ptitle">في حال كان الـ coupon يُدفع نهاية كل سنة</p>${S1.html()}</div><div class="pane"><p class="ptitle">في حال كان الـ coupon السنوي مقسوم على دفعتين بالسنة (كل 6 شهور)</p>${S2.html()}</div></div>`:''}
   <div class="tl" dir="ltr"${k==='bbond'?' hidden':''}>${tl(d)}<p class="legend" dir="rtl">الأرقام تحت = ${d.unit==='years'?'سنين (years)':'شهور (months)'} · ↑ محمد يستلم · ↓ محمد يدفع</p></div>
   ${k==='bbond'?'':`<p class="sum">${d.sum}</p>
   <p class="note">${d.n}</p>`}`;
  wirePrice(d); if(k==='bbond'){S1.wire();S2.wire();}
  document.querySelectorAll('.pick').forEach(g=>{const on=g.dataset.k===k;g.classList.toggle('sel',on);g.setAttribute('aria-pressed',on);});
}
document.querySelectorAll('.pick').forEach(g=>{
  g.addEventListener('click',()=>show(g.dataset.k));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(g.dataset.k);}});
});
show('bbond');
</script>
