<!-- ============================================================ -->
<!-- # ⚙️ 📄  PAGE SETUP -->
<!-- # 🔤 HTML -->
<!-- # 🎯 Sets up the page: its type, Arabic language, right to left text, -->
<!-- #    letter encoding so Arabic shows the right way, phone screen size, -->
<!-- #    the tab name, and it calls the style file -->
<!-- # 🔗 None of this shows on the page. It all runs before the content is -->
<!-- #    drawn. The v number on the style file is bumped on every publish, -->
<!-- #    so a visitor never gets an old copy out of the browser memory -->
<!-- ============================================================ -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTerm</title>
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>

<!-- ============================================================ -->
<!-- # 👆 🔘  PICK WHAT TO DO -->
<!-- # 🔤 HTML -->
<!-- # 🎯 The first panel: two buttons to pick what to do, -->
<!-- #    make a new account or log in -->
<!-- # 🔗 script.js hides this panel and shows the form panel below -->
<!-- #    when one of the buttons is clicked -->
<!-- ============================================================ -->
<div class="box" id="choice">
  <button class="btn btn-main" type="button" id="go-signup">إنشاء حساب</button>
  <button class="btn" type="button" id="go-login">تسجيل الدخول</button>
</div>

<!-- ============================================================ -->
<!-- # 📝 🔑  EMAIL AND PASSWORD FORM -->
<!-- # 🔤 HTML -->
<!-- # 🎯 The form panel: an email box, a password box, a send button, -->
<!-- #    a back button, and a line for messages -->
<!-- # 🔗 Hidden until a button above is clicked. script.js changes the -->
<!-- #    title and the send button text, because the same form is used -->
<!-- #    for both signing up and logging in -->
<!-- ============================================================ -->
<form class="box" id="form" hidden>
  <h1 class="title" id="form-title"></h1>
  <input class="field" id="email" type="email" placeholder="البريد" required autocomplete="email">
  <input class="field" id="password" type="password" placeholder="كلمة السر" required minlength="6" autocomplete="current-password">
  <button class="btn btn-main" type="submit" id="submit"></button>
  <button class="btn btn-flat" type="button" id="back">رجوع</button>
  <p class="note" id="note"></p>
</form>

<!-- ============================================================ -->
<!-- # 👤 ✅  LOGGED IN PANEL -->
<!-- # 🔤 HTML -->
<!-- # 🎯 Shows which account is open, the Google Drive part, and a way out -->
<!-- # 🔗 script.js shows this one after a good login. The three groups -->
<!-- #    inside are three steps, and drive.js shows one at a time: -->
<!-- #    link the account, then pick the place, then the finished file -->
<!-- ============================================================ -->
<div class="box" id="session" hidden>
  <p class="who" id="who"></p>

  <div class="stack" id="step-link">
    <button class="btn btn-main" type="button" id="link-google">اربط حساب قوقل</button>
  </div>

  <div class="stack" id="step-place" hidden>
    <p class="where">مكان الحفظ المستمر</p>
    <button class="btn btn-main" type="button" id="pick-place">اختر المكان بنفسك</button>
    <button class="btn" type="button" id="auto-place">خزّنه في مجلد My Term في جذر ملفاتي</button>

    <div class="stack" id="ask-result" hidden>
      <p class="hint">هل عرضت نافذة قوقل مجلّداتك، أم طلبت منك تسجيل الدخول؟</p>
      <button class="btn btn-flat" type="button" id="saw-folders">عرضت مجلّداتي</button>
      <button class="btn btn-flat" type="button" id="saw-signin">طلبت تسجيل الدخول</button>
    </div>

    <p class="hint" id="shield-hint" hidden></p>
  </div>

  <div class="stack" id="step-done" hidden>
    <p class="where" id="drive-where"></p>
    <button class="btn" type="button" id="save-test">احفظ في ملفي</button>
    <a class="btn btn-flat" id="drive-open" href="#" target="_blank" rel="noopener">افتح الملف في درايف</a>
  </div>

  <p class="note" id="drive-note"></p>
  <button class="btn btn-flat" type="button" id="logout">خروج</button>
</div>

<!-- ============================================================ -->
<!-- # 📦 🔌  LIBRARIES AND SCRIPTS -->
<!-- # 🔤 HTML -->
<!-- # 🎯 Brings in three outside libraries, then this site's own two files: -->
<!-- #    the sign in service, Google permission, and the Google file window -->
<!-- # 🔗 Sits at the end of body so the panels above already exist when the -->
<!-- #    scripts look for them. The libraries come first because the two -->
<!-- #    site files use them. The third one is only needed by the pick your -->
<!-- #    own place path, and a strict browser may block the frame it opens. -->
<!-- #    The v number on the two site files is bumped on every publish, so -->
<!-- #    a reload always brings the new code and never an old copy -->
<!-- ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://apis.google.com/js/api.js"></script>
<script src="script.js?v=10"></script>
<script src="drive.js?v=10"></script>

</body>
</html>
