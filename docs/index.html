<!-- ============================================================ -->
<!-- # 🔤 HTML -->
<!-- # 🎯 Sets up the page: its type, Arabic language, right to left text, -->
<!-- #    letter encoding so Arabic shows the right way, phone screen size, -->
<!-- #    and the name on the browser tab -->
<!-- # 🔗 None of this shows on the page. It all runs before the content is drawn -->
<!-- ============================================================ -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTerm</title>

<!-- ============================================================ -->
<!-- # 🔤 HTML -->
<!-- # 🎯 Calls the style file, so the CSS rules live in their own file -->
<!-- # 🔗 Sits in head so the look is ready before the page is drawn. -->
<!-- #    style.css is right next to this file, inside docs -->
<!-- ============================================================ -->
<link rel="stylesheet" href="style.css">
</head>

<!-- ============================================================ -->
<!-- # 🔤 HTML -->
<!-- # 🎯 The content. It is empty on purpose, because the site is -->
<!-- #    just a gray page with nothing on it -->
<!-- # 🔗 Every visible thing goes in here, and gets its look from style.css -->
<!-- ============================================================ -->
<body></body>

</html>
