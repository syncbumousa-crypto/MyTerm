<!-- ============================================================ -->
<!-- # اللغة    : HTML -->
<!-- # الهدف    : إعلان نوع المستند، يُخبر المتصفّح أن الملف HTML حديث -->
<!-- # الارتباط : يأتي أولًا قبل كل شيء، وبدونه تُقرأ الكتل التالية قراءة خاطئة -->
<!-- ============================================================ -->
<!DOCTYPE html>

<!-- ============================================================ -->
<!-- # اللغة    : HTML -->
<!-- # الهدف    : جذر الصفحة، يحدّد لغتها عربية واتجاهها من اليمين -->
<!-- # الارتباط : يحتوي الكتلتين الكبيرتين بعده، head و body -->
<!-- ============================================================ -->
<html lang="ar" dir="rtl">

<!-- ============================================================ -->
<!-- # اللغة    : HTML -->
<!-- # الهدف    : قسم المعلومات، يحمل ما يحتاجه المتصفّح قبل الرسم ولا يُرى في الصفحة -->
<!-- # الارتباط : يسبق body لأن ما فيه يُطبَّق قبل رسم المحتوى -->
<!-- ============================================================ -->
<head>

<!-- ============================================================ -->
<!-- # اللغة    : HTML -->
<!-- # الهدف    : الترميز، يجعل المتصفّح يقرأ الحروف العربية صحيحة -->
<!-- # الارتباط : يسبق كل نص عربي في الملف وإلا ظهر مشوّشًا -->
<!-- ============================================================ -->
<meta charset="utf-8">

<!-- ============================================================ -->
<!-- # اللغة    : HTML -->
<!-- # الهدف    : مقاس العرض، يجعل الصفحة تُعرض بحجمها الصحيح على الجوّال -->
<!-- # الارتباط : يعمل مع كتلة CSS التالية التي تضبط الأبعاد -->
<!-- ============================================================ -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ============================================================ -->
<!-- # اللغة    : HTML -->
<!-- # الهدف    : عنوان التبويب في المتصفّح -->
<!-- # الارتباط : لا يظهر داخل الصفحة، ولا تعتمد عليه كتلة أخرى -->
<!-- ============================================================ -->
<title>MyTerm</title>

<!-- ============================================================ -->
<!-- # اللغة    : HTML -->
<!-- # الهدف    : كتلة التنسيق، وما بينها وبين إغلاقها لغته CSS لا HTML -->
<!-- # الارتباط : هي التي تُنتج كل ما يراه الزائر، لأن body بعدها فارغ -->
<!-- ============================================================ -->
<style>

  /* ========================================================== */
  /* # اللغة    : CSS */
  /* # الهدف    : القاعدة الوحيدة في الموقع. تُلغي فراغات المتصفّح الافتراضية، */
  /* #             وتجعل ارتفاع الصفحة كامل الشاشة، وتصبغ الخلفية رماديًّا */
  /* # الارتباط : تعمل على html و body معًا لأن الارتفاع الكامل يحتاجهما، */
  /* #             ولولا height لظهر الرمادي شريطًا في الأعلى فقط */
  /* ========================================================== */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #808080;
  }

</style>
</head>

<!-- ============================================================ -->
<!-- # اللغة    : HTML -->
<!-- # الهدف    : جسم الصفحة، وهو فارغ عن قصد لأن الموقع صفحة رمادية بلا محتوى -->
<!-- # الارتباط : لا يظهر منه شيء إلا الخلفية التي صبغتها كتلة CSS السابقة -->
<!-- ============================================================ -->
<body></body>

</html>
