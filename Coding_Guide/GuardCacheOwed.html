<!doctype html>
<meta charset="utf-8">
<title>Guard · a cached copy Drive has not got</title>
<pre id="o">pending</pre>
<script>
  // A COPY PUT ON THE SHELF AND NOT SENT IS A COPY ON ONE MACHINE ONLY,
  // AND A COPY TAKEN OFF THE SHELF UNCHECKED IS A COPY DRIVE HAS MOVED
  // PAST. Both halves of that cost real work in one afternoon:
  //
  //   WRITE SIDE  the fold is a union, so a row this device holds and
  //               the incoming copy does not survives it -- and the
  //               merged copy was shelved under THEIR version with
  //               nothing marked unsent. 241 questions read as written
  //               for an hour and Drive held none.
  //   READ SIDE   the shelf is keyed by the version the BOARD records,
  //               and that note is written by whichever tab last wrote
  //               the board. It can sit behind Drive -- and then the
  //               shelf and the note agree with each other and both are
  //               wrong. 54 answers were safely in Drive while every
  //               open on the machine that wrote them served a copy
  //               without them, and the guard believed that copy.
  //   HANDOVER    opening another chapter sent what was unsent, then
  //               cleared the two marks whatever came of the write --
  //               so a REFUSED write became a silent deletion. 42
  //               answers went that way.
  //
  // So: the sending may shelve without saying anything (it shelves what
  // it just wrote), and so may a copy read straight from Drive (it is
  // not news). Everything else must mark the work unsent, the fold must
  // ask DRIVE for its version rather than believe the board's note, a
  // copy served off the shelf must be checked against Drive, and the
  // handover must refuse to let a failed write go.
  window.onerror = (m, s, l, c) => {
    document.getElementById('o').textContent = 'FAIL ' + m + ' @' + l + ':' + c;
    return true;
  };
  (async () => {
    const o = document.getElementById('o');
    const SRC = '../docs/%F0%9F%93%9ATermBoard/B-End/TermChapterStore.js';
    const text = await (await fetch(SRC + '?t=' + Date.now())).text();
    const lines = text.split('\n');

    // Up to the NEXT declaration, whatever it is: an end marker named by
    // hand is an end marker that moves when the file is edited, and the
    // block then measures nothing while still reporting a pass
    const spanOf = (from, stop) => {
      const a = text.indexOf(from);
      if (a < 0) return [-1, -1];
      const b = text.indexOf(stop, a + from.length);
      return [a, b < 0 ? text.length : b];
    };
    const [pushA, pushB] = spanOf('async function push()', '\n  const later =');
    const [foldA, foldB] = spanOf('async function foldFromDrive()', '\n    refresh:');
    const [bellA, bellB] = spanOf('refresh: async () =>', '\n    shut:');
    const [shelfA, shelfB] = spanOf('cacheRead(chapter.id', '\n      return open;');
    const [leaveA, leaveB] = spanOf('await push().catch', 'await settle(');
    const FOLD = foldA < 0 ? '' : text.slice(foldA, foldB);
    const BELL = bellA < 0 ? '' : text.slice(bellA, bellB);
    const SHELF = shelfA < 0 ? '' : text.slice(shelfA, shelfB);
    const LEAVING = leaveA < 0 ? '' : text.slice(leaveA, leaveB);

    // Call sites only -- never the definition, or the check passes on a
    // file in which nothing calls it at all
    const sites = [];
    const want = /cacheWrite\(/g;
    for (let m; (m = want.exec(text));) {
      const at = m.index;
      if (/const cacheWrite\s*=\s*$/.test(text.slice(Math.max(0, at - 30), at))) continue;
      sites.push(at);
    }

    const MARK = /wrote\(\)|contentDirty\s*=\s*true/;
    const lineOf = at => text.slice(0, at).split('\n').length;
    // A copy that is PURELY what Drive just handed over needs no mark:
    // it is not news. One with anything of ours folded into it is, and
    // the fold is the whole danger -- so what is asked is the REASON
    // and not the line number: read from Drive just above, with nothing
    // merged into it on the way to the shelf
    const FRESH = at => {
      const n = lineOf(at);
      const before = lines.slice(Math.max(0, n - 16), n).join('\n');
      return /readFile\(/.test(before) && !/merge/i.test(before);
    };
    const loose = [];
    let sending = 0, fresh = 0;
    sites.forEach(at => {
      if (at >= pushA && at <= pushB) { sending++; return; }
      if (FRESH(at)) { fresh++; return; }
      const n = lineOf(at);
      const after = lines.slice(n - 1, n + 11).join('\n');
      if (!MARK.test(after)) loose.push('line ' + n);
    });

    const foldOwes = /cacheWrite\(/.test(FOLD) && MARK.test(FOLD);
    const foldAsksDrive = /readFile\(open\.chapter\.contentId\)/.test(FOLD)
                       && /Number\(incoming\.version\)/.test(FOLD);
    const bellFolds = /foldFromDrive\(\)/.test(BELL);
    const shelfChecked = /foldFromDrive\(\)/.test(SHELF);
    // The trigger that was the bug: the fold run only when the board's
    // note differs from the copy in hand, which is two readings of the
    // same stale number agreeing with each other
    const believesTheNote = /const theirVersion = Number\(open\.chapter\.contentVersion\)/.test(text);
    const refuses = /if \(contentDirty \|\| stateDirty\) return/.test(LEAVING);
    const blanket = /contentDirty = stateDirty = false/.test(LEAVING);

    const faults = [];
    if (sites.length < 2) faults.push('the file was not read: ' + sites.length + ' call sites');
    if (pushA < 0) faults.push('the sending was not found');
    if (foldA < 0) faults.push('the fold was not found where both sides can reach it');
    if (bellA < 0) faults.push('the bell was not found');
    if (shelfA < 0) faults.push('the shelf read was not found');
    if (leaveA < 0) faults.push('the handover to the next chapter was not found');
    if (sending !== 1) faults.push('the sending caches ' + sending + ' times, expected 1');
    if (loose.length) faults.push('cached without being marked unsent: ' + loose.join(', '));
    if (foldA >= 0 && !foldOwes) faults.push('the fold caches a copy it never marks unsent');
    if (foldA >= 0 && !foldAsksDrive) faults.push('the fold does not ask Drive for its own version');
    if (bellA >= 0 && !bellFolds) faults.push('the bell keeps a fold of its own instead of the shared one');
    if (shelfA >= 0 && !shelfChecked) faults.push('a copy off the shelf is never checked against Drive');
    if (believesTheNote) faults.push('the fold is still triggered by the version the board records');
    if (leaveA >= 0 && !refuses) faults.push('a refused write is let go of when the chapter changes');
    if (blanket) faults.push('the handover clears the unsent marks whatever came of the write');

    o.textContent = (faults.length ? 'FAIL ' + faults.join(' | ') : 'OK')
      + '\ncall sites: ' + sites.length + ' (sending ' + sending + ', just read ' + fresh
      + ', weighed ' + (sites.length - sending - fresh) + ')'
      + '\nunmarked:   ' + loose.length
      + '\nfold:       ' + (foldOwes ? 'marks unsent' : 'SILENT')
      + ', ' + (foldAsksDrive ? 'asks Drive' : 'BELIEVES THE NOTE')
      + '\nshelf:      ' + (shelfChecked ? 'checked against Drive' : 'TRUSTED BLINDLY')
      + '\nbell:       ' + (bellFolds ? 'uses the shared fold' : 'HAS ITS OWN')
      + '\nhandover:   ' + (refuses ? 'refuses a failed write' : 'LETS IT GO')
      + (blanket ? ', clears the marks blindly' : '');
  })();
</script>
