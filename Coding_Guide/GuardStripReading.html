<!doctype html>
<meta charset="utf-8">
<title>Guard · the two lines under a part</title>
<pre id="o">pending</pre>
<script>
  // THE SECOND LINE IS THE ONE THAT SAYS WHETHER YOU ACTUALLY HAVE IT,
  // AND IT WAS GREY FOR A WHOLE KIND OF PART.
  //
  // A rules part keeps its work in CARDS, which are not rows and live in
  // a file of their own. Asked how many of its rows the bank had right
  // it answered none — truthfully and uselessly — so the heaviest part
  // of both numerical courses showed a grey rail for ever. And the
  // readings were told nothing while a run was going, so answering
  // thirty questions moved no line until the reader left the bank.
  //
  // Both are measured here by RUNNING the real code: the counter cut out
  // of the store, the rail cut out of the screen. A guard that restates
  // the rule proves only that two copies of one idea agree.
  window.onerror = (m, s, l, c) => {
    document.getElementById('o').textContent = 'FAIL ' + m + ' @' + l + ':' + c;
    return true;
  };
  (async () => {
    const o = document.getElementById('o');
    const B = '../docs/%F0%9F%93%9ATermBoard/B-End/';
    const F = '../docs/%F0%9F%93%9ATermBoard/F-End/';
    const grab = async p => (await fetch(p + '?t=' + Date.now())).text();
    const [store, screen, quiz] = await Promise.all([
      grab(B + 'TermChapterStore.js'), grab(F + 'TermCourseScreen.js'), grab(F + 'TermChapterQuiz.js')]);

    const faults = [], out = [];
    [['TermChapterStore.js', store], ['TermCourseScreen.js', screen], ['TermChapterQuiz.js', quiz]]
      .forEach(([name, text]) => {
        if (text.length < 1000) faults.push(name + ' was not read: ' + text.length + ' chars');
      });

    // Cut a declaration out whole, from its head to the line that closes
    // it at the same indent -- named ends move when a file is edited
    const cut = (text, head) => {
      const a = text.indexOf(head);
      if (a < 0) return null;
      const pad = ' '.repeat(text.slice(0, a).length - text.lastIndexOf('\n', a) - 1);
      const end = text.indexOf('\n' + pad + '};', a);
      return end < 0 ? null : text.slice(a, end + pad.length + 3);
    };

    // ---- 1: the counter, run against keys of both shapes
    const counter = cut(store, 'const saidOn =');
    if (!counter) faults.push('the sheet counter was not found in the store');
    else {
      const saidOn = eval('(' + counter.replace(/^const saidOn =\s*/, '').replace(/;$/, '') + ')');
      const said = new Map([['sheet:rules1#0', 'ok'], ['sheet:rules1#3', 'no'],
                            ['sheet:rules2#0', 'ok'], ['sheet:rules2#1', 'ok'],
                            ['r-arow', 'ok'], ['r-brow', 'no']]);
      const table = [
        ['rules1 right', { group: 'rules1' }, 'ok', 1],
        ['rules1 wrong', { group: 'rules1' }, 'no', 1],
        ['rules2 right', { group: 'rules2' }, 'ok', 2],
        ['a part with no group', { group: '' }, 'ok', 0]
      ];
      table.forEach(([what, part, want, expect]) => {
        const got = saidOn(said, part, want);
        if (got !== expect) faults.push(what + ' counted ' + got + ', expected ' + expect);
      });
      out.push('sheet verdicts: rules1 ' + saidOn(said, { group: 'rules1' }, 'ok') + ' right / '
               + saidOn(said, { group: 'rules1' }, 'no') + ' wrong · rules2 '
               + saidOn(said, { group: 'rules2' }, 'ok') + ' right · rows are not counted as sheets');
    }

    // ---- 2: and it is WIRED to the rules branch, not merely present
    const mapAt = store.indexOf('rows: sheets ?');
    const mapping = mapAt < 0 ? '' : store.slice(mapAt, store.indexOf('};', mapAt));
    if (!mapping) faults.push('what a part reports was not found');
    else {
      ['good', 'bad'].forEach(which => {
        const line = (mapping.match(new RegExp(which + ':[^\\n]*')) || [''])[0];
        if (!/sheets \?/.test(line) || !/saidOn\(/.test(line)) {
          faults.push('a rules part still counts its ' + which + ' off rows: ' + line.trim().slice(0, 60));
        }
      });
    }

    // ---- 3: the rail itself, built by the screen's own code
    const mix = cut(screen, 'const mixOf =');
    if (!mix) faults.push('the green-and-red rail was not found');
    else {
      const mixOf = eval('(' + mix.replace(/^const mixOf =\s*/, '').replace(/;$/, '') + ')');
      const line = mixOf(3, 1, 10, '3/4');
      const rail = line.querySelector('.ctab-bar');
      const fills = [...line.querySelectorAll('i')];
      const widths = fills.map(f => f.style.width);
      out.push('rail: ' + (rail ? rail.className : 'NONE') + ' · fills ' + widths.join(' + ')
               + ' · reading "' + (line.querySelector('.ctab-count')?.textContent || '') + '"');
      if (!rail || !/\bmix\b/.test(rail.className)) faults.push('the two fills do not share one rail');
      if (fills.length !== 2) faults.push('the rail carries ' + fills.length + ' fills, expected 2');
      if (widths[0] !== '30%' || widths[1] !== '10%') faults.push('3 right and 1 wrong of 10 drew ' + widths.join(' + '));
      if (!fills[0]?.classList.contains('good') || !fills[1]?.classList.contains('bad')) {
        faults.push('right and wrong are not told apart on the rail');
      }
      // Nothing asked yet must be an EMPTY rail and not a full one: a
      // division by zero that lands on 100% would read as mastery
      const none = mixOf(0, 0, 0, null);
      const empty = [...none.querySelectorAll('i')].map(f => f.style.width);
      if (empty.some(w => w !== '0%')) faults.push('a part the bank never asked draws ' + empty.join(' + '));
      if (none.querySelector('.ctab-count')) faults.push('a reading was drawn where none was given');
    }

    // ---- 4: and the words under the pointer follow the same numbers
    const words = cut(screen, 'const readingOf =');
    if (!words) faults.push('the words of the reading were not found');
    else {
      const readingOf = eval('(' + words.replace(/^const readingOf =\s*/, '').replace(/;$/, '') + ')');
      const nothing = readingOf('Terms', 0, 0, 0, 0);
      const unasked = readingOf('Terms', 10, 4, 0, 0);
      const asked = readingOf('Terms', 10, 4, 3, 1);
      out.push('words: "' + asked + '"');
      if (!/nothing in it yet/.test(nothing)) faults.push('an empty part does not say so: ' + nothing);
      if (!/not asked you any/.test(unasked)) faults.push('an unasked part does not say so: ' + unasked);
      if (!/3 right and 1 wrong of 4/.test(asked)) faults.push('the words do not match the rail: ' + asked);
    }

    // ---- 5: the strip is told at every answer, not at the end
    const onward = cut(quiz, 'const onward =') || (quiz.match(/const onward = \(\) => \{[\s\S]*?\n  \};/) || [''])[0];
    out.push('after an answer: ' + (onward ? onward.replace(/\s+/g, ' ').slice(0, 72) : 'NOT FOUND'));
    if (!onward) faults.push('what happens after an answer was not found');
    else if (!/told\(\)/.test(onward)) faults.push('an answer does not tell the strip, so the lines stand still through a run');

    // ---- 6: A BANK QUESTION THAT WAS ANSWERED IS DONE
    //
    // The reader: "in the TB, the completion line at the top should fill
    // when the TB questions are solved." Nobody ticks a question he has
    // just answered, so the first line stayed grey over a bank he had
    // worked right through. Run here against the real `doneIn`, which is
    // the ONE place that knows what finished means -- the hours, the day
    // record, the chapter bar and the strip all read it, so measuring
    // the strip alone would not say whether they agree
    const doneSrc = cut(store, 'const doneIn =');
    const weighSrc = cut(store, 'const weighToday =');
    const settled = (store.match(/const TB_SETTLED = '([^']+)'/) || [])[1];
    if (!doneSrc) faults.push('what counts as done was not found in the store');
    if (!weighSrc) faults.push('the day weighing was not found in the store');
    if (!settled) faults.push('the note that the rule has changed has no name in the store');
    if (doneSrc && weighSrc && settled) {
      // Two parts with the SAME marks on them, so the only thing that
      // can make their readings differ is the kind of part
      const rows = n => [1, 2, 3, 4].map(i => ({ id: n + i }));
      const parts = [{ id: 's-terms', kind: 'terms', each: 1, rows: rows('r') },
                     { id: 's-bank', kind: 'tb', each: 2, rows: rows('q') }];
      const marks = { r1: { on: true }, r2: { was: 'ok' },
                      q1: { on: true }, q2: { was: 'ok' }, q3: { was: 'no' } };
      const open = { course: { id: 'c1' }, chapter: { id: 'h1' },
                     state: { marks: marks, seen: null } };
      const livingSections = () => parts;
      // Not under test here and not restated: a flat price, so the
      // arithmetic of the credit can be read at a glance
      const rateOf = s => s.each;
      const doneIn = eval('(' + doneSrc.replace(/^const doneIn =\s*/, '').replace(/;$/, '') + ')');
      const TB_SETTLED = settled;
      const weighToday = eval('(' + weighSrc.replace(/^const weighToday =\s*/, '').replace(/;$/, '') + ')');

      const dTerms = doneIn(parts[0]), dBank = doneIn(parts[1]);
      out.push('done: a terms part with one tick and one verdict reads ' + dTerms
               + ' · a bank with one tick and two answers reads ' + dBank + ' of 4');
      if (dBank !== 3) faults.push('a bank with one ticked and two answered questions reads ' + dBank + ' of 4 done');
      // AND NOT THE OTHER WAY ROUND: on every other kind of part the
      // tick is still the only word. A verdict on a terms row is what
      // the bank says ABOUT it, not work the reader finished
      if (dTerms !== 1) faults.push('a terms part counted a verdict as work done: ' + dTerms + ' of 4');

      // ★ AND THE DAY RECORD IS NOT HANDED THE PAST. Hundreds of
      //   answers already given would all have become newly finished
      //   work on one impossible afternoon
      open.state.seen = { 's-terms': 0, 's-bank': 0 };
      const first = weighToday();
      const forBank = first.credits.find(c => c.s === 's-bank');
      const forTerms = first.credits.find(c => c.s === 's-terms');
      out.push('the first open after the change: ' + first.credits.length + ' credit(s) · bank '
               + (forBank ? forBank.n + ' questions' : 'nothing') + ' · terms '
               + (forTerms ? forTerms.n + ' row(s)' : 'nothing')
               + ' · the mark re-taken ' + first.rebased + ' · note ' + first.fresh[TB_SETTLED]);
      if (forBank) {
        faults.push('the change credited ' + forBank.n + ' already-answered question(s) to today'
          + ' -- on his own courses that is hundreds of them in one afternoon');
      }
      if (!first.rebased) faults.push('the mark was not re-taken, so there is nothing to stop it happening again');
      if (!(Number(first.fresh[TB_SETTLED]) > 0)) faults.push('nothing was written to say the mark had been re-taken');
      // and ordinary work is still credited in the same breath: the
      // re-taking must not swallow the rest of the chapter
      if (!forTerms || forTerms.n !== 1) {
        faults.push('a tick put on a terms row was swallowed by the re-taking: '
                    + (forTerms ? forTerms.n : 'nothing'));
      }

      // and once the note is there, the next answer counts normally
      open.state.seen = { 's-terms': 1, 's-bank': 2 };
      open.state.seen[TB_SETTLED] = 1;
      const later = weighToday();
      const now = later.credits.find(c => c.s === 's-bank');
      out.push('and the next answer: ' + (now ? now.n + ' question for ' + now.m + ' minutes' : 'NOTHING')
               + ' · re-taken again ' + later.rebased);
      if (!now || now.n !== 1) faults.push('an answer after the change was not credited: ' + (now ? now.n : 'nothing'));
      if (later.rebased) faults.push('the mark is re-taken on every open, so only the first answer ever counts');

      // and a tick taken back is still taken back
      open.state.seen = { 's-bank': 4 };
      open.state.seen[TB_SETTLED] = 1;
      const back = weighToday().credits.find(c => c.s === 's-bank');
      if (!back || back.n !== -1) faults.push('a question un-answered was not taken back: ' + (back ? back.n : 'nothing'));
    }

    // ---- 7: and every reading of it is wired to that one place
    const partSrc = mapAt < 0 ? '' : store.slice(mapAt, store.indexOf('};', mapAt));
    const learntLine = (partSrc.match(/learnt:[^\n]*/) || [''])[0];
    const tickedLine = (partSrc.match(/ticked:[^\n]*/) || [''])[0];
    out.push('the part reports: ' + learntLine.trim() + '  |  ' + tickedLine.trim().slice(0, 40));
    if (!/doneIn\(s\)/.test(learntLine)) {
      faults.push('what a part says is done is counted a second time instead of asked of doneIn: ' + learntLine.trim());
    }
    if (!tickedLine) faults.push('a part does not report how many of it are TICKED, which the tick-all button needs');
    // the button must read the ticks, or on a bank it offers to take a
    // tick off forty questions that carry none
    const btn = screen.indexOf('const paintAll =');
    const paint = btn < 0 ? '' : screen.slice(btn, btn + 400);
    if (/part\.learnt === part\.rows/.test(paint)) {
      faults.push('the tick-all button reads what is DONE, so on an answered bank it offers to untick what was never ticked');
    }
    // and the note travels even when nothing was credited
    if (!/weighed\.rebased/.test(store)) {
      faults.push('the re-taken mark is not in the condition that writes the state, so it is re-taken for ever');
    }
    // and the words say a word that is true of a tick AND of an answer
    // Read off the reading ITSELF and not off the whole file: asked of
    // the file it also caught the header comment above the two lines --
    // which was genuinely out of date and was fixed, but a check that
    // fails on prose will fail on prose for ever after
    const wordsSrc = cut(screen, 'const readingOf =') || '';
    if (/ticked off/.test(wordsSrc)) {
      faults.push('the reading still says "ticked off" of a bank nobody ticked');
    }

    o.textContent = (faults.length ? 'FAIL ' + faults.join(' | ') : 'OK') + '\n' + out.join('\n');
  })().catch(e => {
    document.getElementById('o').textContent = 'FAIL the guard itself threw: ' + e;
  });
</script>
